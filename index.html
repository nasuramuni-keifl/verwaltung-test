  /* ---------- Bereich: Einheitenarten ---------- */
  function renderEinheiten() {
    const zeilen = S.einheitenArten.map(t => "<div class='e-zeile'>" +

      "<div class='feld'><label>Standard</label><button type='button' class='schalter' role='switch' aria-checked='" + !!t.standard + "' aria-label='Immer im Vertrag anzeigen' data-act='e-standard' data-id='" + esc(t.id) + "'></button></div>" +
      "<button class='btn klein gefahr' data-act='e-loeschen' data-id='" + esc(t.id) + "'>" + (S.loeschen === t.id ? "Wirklich löschen?" : "Löschen") + "</button></div>").join("");
    app.innerHTML = "<div class='seite'><div class='hero'><h1>Ihre Einheiten</h1><p>Legen Sie fest, welche Arten von Einheiten Sie verwalten und was Sie dafür üblicherweise berechnen. Arten mit eingeschaltetem „Standard“ erscheinen in jedem neuen Vertrag, alle anderen fügen Sie dort bei Bedarf mit einem Tipp hinzu.</p></div>" +
      "<section class='panel'>" + (zeilen || "<p class='hilfe'>Noch keine Einheitenarten angelegt.</p>") +
      "<div class='leiste'><button class='btn haupt' data-act='e-neu'>Neue Einheitenart</button></div></section></div>";
  }

  /* ---------- Warteliste: fertige Verträge zwischenparken ---------- */
  const wlSichern = () => VSpeicher.speichern("wartende", S.warteliste);
  const wlName = w => (w.angaben && w.angaben.auftraggeber) || (w.angaben && w.angaben.objekt) || "Ohne Namen";
  function wlAufnehmen() {
    const eintrag = { id: S.wlId || Vertrag.neueId(), art: S.art, angaben: JSON.parse(JSON.stringify(S.angaben)),
      antworten: JSON.parse(JSON.stringify(S.antworten)), gespeichert: new Date().toISOString() };
    const i = S.warteliste.findIndex(x => x.id === eintrag.id);
    if (i >= 0) S.warteliste[i] = eintrag; else S.warteliste.unshift(eintrag);
    S.wlId = eintrag.id; wlSichern();
    toast(i >= 0 ? "In der Warteliste aktualisiert" : "In die Warteliste gelegt");
  }
  function wlLaden(id) {
    const w = S.warteliste.find(x => x.id === id); if (!w) return;
    S.art = w.art; S.angaben = { ...LEER, ...w.angaben }; S.antworten = { ...w.antworten }; S.wlId = w.id;
    S.tab = "vertrag"; S.ansicht = "maske"; entwurfSichern(); render(); summenAktualisieren(); oben();

    }).filter(k => k.text);

  function logoLaden(datei) {
    if (!datei || !datei.type.startsWith("image/")) { toast("Bitte wählen Sie eine Bilddatei (PNG oder JPG)."); return; }
    const leser = new FileReader();
    leser.onload = () => {
      const img = new Image();
      img.onload = () => {
        const f = Math.min(1, 600 / (img.naturalWidth || 600), 240 / (img.naturalHeight || 240));
        const c = document.createElement("canvas"); c.width = Math.max(1, Math.round((img.naturalWidth || 600) * f)); c.height = Math.max(1, Math.round((img.naturalHeight || 240) * f));
        const g = c.getContext("2d"); g.drawImage(img, 0, 0, c.width, c.height); let d = c.toDataURL("image/png");
        if (d.length > 180000) { g.globalCompositeOperation = "destination-over"; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); d = c.toDataURL("image/jpeg", 0.85); }
        S.verwalter.logo = d; VSpeicher.speichern("verwalter", S.verwalter); renderDaten(); toast("Logo übernommen");
      };
      img.onerror = () => toast("Das Bild konnte nicht gelesen werden.");
      img.src = leser.result;
    };
    leser.readAsDataURL(datei);
  }

      [["normal", "Vollzeit / Teilzeit"], ["aushilfe", "Aushilfe / Minijob"]].map(([w, l]) => "<option value='" + w + "'" + (p.art === w ? " selected" : "") + ">" + l + "</option>").join("") + "</select></div>" +
      "<div class='feld'><label for='zp-wst'>Wochenstunden</label><select id='zp-wst' data-zperson='wochenstunden'>" +
      WOCHENSTUNDEN.map(x => "<option value='" + x + "'" + (Number(p.wochenstunden) === x ? " selected" : "") + ">" + String(x).replace(".", ",") + " Stunden</option>").join("") + "</select></div>" +
      f("urlaubJahr", "Urlaubstage im Jahr", "number", "Gesetzlich mindestens 20 bei Fünftagewoche (§ 3 BUrlG).") +
      f("startUeberstunden", "Startsaldo Überstunden", "number", "Stunden, die zu Beginn der Erfassung bestanden.") + "</div>" +
      "<h2 style='margin-top:24px'>Standardzeiten</h2><p class='unter'>Werden im Tagesfenster als Vorschlag eingesetzt.</p><div class='felder'>" +
      "<div class='feld'><label>Beginn</label>" + zeitFeld("data-zperson='vonStd'", p.vonStd, "Beginn") + "</div>" +
      "<div class='feld'><label>Ende</label>" + zeitFeld("data-zperson='bisStd'", p.bisStd, "Ende") + "</div>" +
      "<div class='feld'><label>Pause von</label>" + zeitFeld("data-zperson='pauseVon'", p.pauseVon, "Pause von") + "</div>" +
      "<div class='feld'><label>Pause bis</label>" + zeitFeld("data-zperson='pauseBis'", p.pauseBis, "Pause bis") + "</div></div>" +
      "<h2 style='margin-top:24px'>Ansicht</h2><div class='feld'><label for='z-standard'>Standardansicht</label><select id='z-standard' data-zstandard='1'>" +
      [["woche", "Woche"], ["monat", "Monat"], ["jahr", "Jahr"]].map(([w, l]) => "<option value='" + w + "'" + (S.zeitraum === w ? " selected" : "") + ">" + l + "</option>").join("") + "</select></div>" +
      "<h2 style='margin-top:24px'>Sollstunden je Wochentag</h2><div class='felder'>" +
      [[1, "Montag"], [2, "Dienstag"], [3, "Mittwoch"], [4, "Donnerstag"], [5, "Freitag"], [6, "Samstag"]].map(([k, l]) =>
        "<div class='feld'><label>" + l + "</label><input type='number' step='0.25' min='0' data-zsoll='" + k + "' value='" + esc(p.soll[k] || 0) + "'></div>").join("") +
      "</div><p class='unter'>Summe: " + [1, 2, 3, 4, 5, 6].reduce((s, k) => s + (Number(p.soll[k]) || 0), 0).toLocaleString("de-DE") + " Stunden</p>" +
      "<div class='leiste'><div><button class='btn klein' data-zact='soll-standard'>Aus Wochenstunden verteilen</button></div></div></section>" +
      "<section class='gruppe'><h2>Feiertage</h2><div class='feld'><label for='z-land'>Bundesland</label><select id='z-land' data-zland='1'>" +
      LAENDER.map(([w, l]) => "<option value='" + w + "'" + (S.land === w ? " selected" : "") + ">" + l + "</option>").join("") + "</select>" +
      "<small>Gilt für alle Mitarbeiter und wird für jedes Jahr automatisch berechnet.</small></div></section>";
  }

  function render() {
    if (!app) return;
    const liste = team().filter(m => !m.ausgeschieden);
    if (!S.mid && liste.length) { let ich = ""; try { ich = window.Teamdaten ? window.Teamdaten.ichBin() : ""; } catch (e) {} S.mid = liste.some(m => m.id === ich) ? ich : liste[0].id; }
    let h = "<div class='seite'>" + kopfHtml();
    if (!liste.length) { app.innerHTML = h + "<div class='leer'><h2>Noch keine Mitarbeiter</h2><p>Legen Sie unter „Mitarbeiter“ Ihr Team an.</p></div></div>"; return; }
    if (!S.mid) { app.innerHTML = h + "<div class='leer'><h2>Bitte Mitarbeiter wählen</h2></div></div>"; return; }
    const p = personVon(S.mid); const jd = jahrVon(S.mid, S.jahr); const fTage = feiertage(S.jahr, S.land);
    h += S.tab === "person" ? personHtml(p) : S.tab === "urlaub" ? urlaubHtml(p, jd, fTage) : zeitenHtml(p, jd, fTage);
    app.innerHTML = h + "</div>";
  }

  /* ---------- Ereignisse ---------- */
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-zact]"); if (!b || !document.getElementById("ze") || document.getElementById("ze").hidden) return;
    const act = b.dataset.zact; const id = b.dataset.id;
    const p = S.mid ? personVon(S.mid) : null; const jd = S.mid ? jahrVon(S.mid, S.jahr) : null;
    const fTage = feiertage(S.jahr, S.land);
    switch (act) {
      case "tab": S.tab = b.dataset.wert; render(); break;
      case "zr-zurueck": case "zr-vor": {
        const vor = act === "zr-vor" ? 1 : -1;
        if (S.zeitraum === "woche") { const a = montagVon(S.wocheAb ? ausIso(S.wocheAb) : new Date()); S.wocheAb = iso(plusTage(a, 7 * vor)); S.jahr = Number(S.wocheAb.slice(0, 4)); }
        else if (S.zeitraum === "monat") { if (S.monat + vor < 0) { S.monat = 11; S.jahr--; } else if (S.monat + vor > 11) { S.monat = 0; S.jahr++; } else S.monat += vor; }
        else S.jahr += vor;
        render(); break;
      }
      case "zr-wahl": S.zeitraum = b.dataset.wert; render(); break;
      case "zr-heute": S.monat = new Date().getMonth(); S.jahr = new Date().getFullYear(); S.wocheAb = ""; render(); break;
      case "zr-monat": S.zeitraum = "monat"; S.monat = Number(b.dataset.wert); render(); break;
      case "soll-standard": p.soll = sollFuer(Number(p.wochenstunden) || 38.5); personSichern(S.mid); render(); break;
      case "tag-auf": {
        S.tagOffen = b.dataset.tag; const vorhanden = jd.tage[S.tagOffen];
        S.tagEntwurf = vorhanden ? JSON.parse(JSON.stringify(vorhanden))
          : { status: "", start: p.vonStd || "", ende: p.bisStd || "", pausen: (p.pauseVon && p.pauseBis) ? [{ start: p.pauseVon, ende: p.pauseBis }] : [], notiz: "" };
        render(); break;
      }
      case "tag-heute": {
        S.monat = new Date().getMonth(); S.jahr = new Date().getFullYear(); S.tagOffen = heuteIso();
        const v = jahrVon(S.mid, S.jahr).tage[S.tagOffen];
        S.tagEntwurf = v ? JSON.parse(JSON.stringify(v)) : { status: "", start: p.vonStd || "", ende: p.bisStd || "", pausen: (p.pauseVon && p.pauseBis) ? [{ start: p.pauseVon, ende: p.pauseBis }] : [], notiz: "" };
        render(); break;
      }
      case "tag-zu": S.tagOffen = null; S.tagEntwurf = null; render(); break;
      case "tag-status": S.tagEntwurf.status = b.dataset.wert; render(); break;
      case "tag-standard": S.tagEntwurf.start = p.vonStd || ""; S.tagEntwurf.ende = p.bisStd || "";
        S.tagEntwurf.pausen = (p.pauseVon && p.pauseBis) ? [{ start: p.pauseVon, ende: p.pauseBis }] : []; render(); break;
      case "pause-neu": S.tagEntwurf.pausen = (S.tagEntwurf.pausen || []).concat({ start: p.pauseVon || "12:30", ende: p.pauseBis || "13:30" }); render(); break;
      case "pause-weg": S.tagEntwurf.pausen.splice(Number(b.dataset.i), 1); render(); break;
      case "tag-speichern": {
        const t = S.tagEntwurf; const datum = S.tagOffen;
        const leer = !t.status && !t.start && !t.ende && !t.notiz && !(t.pausen || []).length;
        if (leer) { delete jd.tage[datum]; } else {
          if (t.status) { t.start = ""; t.ende = ""; t.pausen = []; }
          jd.tage[datum] = { status: t.status || "", start: t.start || "", ende: t.ende || "", pausen: (t.pausen || []).filter(x => x.start && x.ende), notiz: t.notiz || "" };
        }
        jahrSichern(S.mid, S.jahr); S.tagOffen = null; S.tagEntwurf = null; render(); toast("Tag gespeichert"); break;
      }
      case "tag-leeren": { delete jd.tage[S.tagOffen]; jahrSichern(S.mid, S.jahr); S.tagOffen = null; S.tagEntwurf = null; render(); toast("Eintrag gelöscht"); break; }
      case "antrag-neu": S.antragNeu = { typ: "urlaub", von: "", bis: "", notiz: "" }; render(); break;
      case "antrag-abbrechen": S.antragNeu = null; render(); break;
      case "antrag-speichern": {
        const a = S.antragNeu; if (!a.von || !a.bis) { toast("Bitte Von und Bis eintragen."); return; }
        if (a.bis < a.von) { toast("Das Ende liegt vor dem Beginn."); return; }
        const tage = arbeitstageJahre(p, a.von, a.bis);
        if (!tage.length) { toast("In diesem Zeitraum liegt kein Arbeitstag."); return; }
        const eintrag = { id: neueId(), typ: a.typ, von: a.von, bis: a.bis, tage: tage.length, notiz: a.notiz || "",
          status: a.typ === "krank" ? "genehmigt" : "offen", erstellt: heuteIso() };
        jd.antraege.push(eintrag);
        if (eintrag.status === "genehmigt") tage.forEach(d => tagSetzen(S.mid, d, { status: a.typ }));
        S.antragNeu = null; jahrSichern(S.mid, S.jahr); render(); toast("Eingetragen"); break;
      }
      case "antrag-ok": {
        const a = jd.antraege.find(x => x.id === id); if (!a) return;
        a.status = "genehmigt";
        arbeitstageJahre(p, a.von, a.bis).forEach(d => tagSetzen(S.mid, d, { status: a.typ }));
        jahrSichern(S.mid, S.jahr); render(); toast("Genehmigt und eingetragen"); break;
      }
      case "antrag-nein": {
        const a = jd.antraege.find(x => x.id === id); if (!a) return;
        a.status = "abgelehnt";
        arbeitstageJahre(p, a.von, a.bis).forEach(d => tagLoeschenStatus(S.mid, d, a.typ));
        jahrSichern(S.mid, S.jahr); render(); toast("Abgelehnt"); break;
      }
      case "antrag-weg": {
        const a = jd.antraege.find(x => x.id === id); if (!a) return;
        if (S.offen !== id) { S.offen = id; toast("Noch einmal tippen zum Löschen."); return; }
        arbeitstageJahre(p, a.von, a.bis).forEach(d => tagLoeschenStatus(S.mid, d, a.typ));
        jd.antraege = jd.antraege.filter(x => x.id !== id); S.offen = null; jahrSichern(S.mid, S.jahr); render(); toast("Gelöscht"); break;
      }
    }
  });

  document.addEventListener("input", e => {
    const t = e.target; const ze = document.getElementById("ze"); if (!ze || ze.hidden) return;
    if (t.id === "z-mid") { S.mid = t.value; S.tab = S.tab; render(); return; }
    if (t.id === "z-jahr") { const j = Number(t.value); if (j > 1999 && j < 2101) { S.jahr = j; render(); } return; }
    if (t.dataset.zzeitraum) { S.zeitraum = t.value; render(); return; }
    if (t.dataset.zstandard) { S.zeitraum = t.value; ZSpeicher.lokalSetzen("ansicht", t.value); render(); toast("Standardansicht gespeichert"); return; }
    if (t.dataset.zland) { S.land = t.value; ZSpeicher.lokalSetzen("land", S.land); render(); return; }
    if (!S.mid) return;
    const p = personVon(S.mid); const jd = jahrVon(S.mid, S.jahr);
    if (t.dataset.zperson) {
      const f = t.dataset.zperson; p[f] = f === "wochenstunden" ? Number(t.value) : t.value;
      if (f === "wochenstunden") p.soll = sollFuer(Number(t.value));
      personSichern(S.mid); if (["wochenstunden", "art"].includes(f)) render();
      return;
    }
    if (t.dataset.zsoll) { p.soll[Number(t.dataset.zsoll)] = Number(t.value) || 0; personSichern(S.mid); return; }
    if (t.dataset.zuebertrag) {
      p.uebertrag = (p.uebertrag || []).filter(u => Number(u.jahr) !== S.jahr);
      const zeile = { jahr: S.jahr, tage: 0, grund: "" };
      const feldTage = document.querySelector("[data-zuebertrag='tage']"); const feldGrund = document.querySelector("[data-zuebertrag='grund']");
      zeile.tage = zahl(feldTage && feldTage.value); zeile.grund = (feldGrund && feldGrund.value) || "";
      if (zeile.tage) p.uebertrag.push(zeile);
      personSichern(S.mid); return;
    }
    if (t.dataset.zantrag && S.antragNeu) { S.antragNeu[t.dataset.zantrag] = t.value; if (["von", "bis", "typ"].includes(t.dataset.zantrag)) render(); return; }
    if (t.dataset.ztagf && S.tagEntwurf) { S.tagEntwurf[t.dataset.ztagf] = t.classList.contains("z-zeit") ? t.value : t.value;
      clearTimeout(window.__zeT); window.__zeT = setTimeout(render, 700); return; }
    if (t.dataset.zpause && S.tagEntwurf) { const [i, f2] = t.dataset.zpause.split("|"); (S.tagEntwurf.pausen[Number(i)] || {})[f2] = t.value;
      clearTimeout(window.__zeT); window.__zeT = setTimeout(render, 700); return; }
    if (t.dataset.ztag) {
      const [datum, feld] = t.dataset.ztag.split("|");
      const tag = jd.tage[datum] || {};
      if (feld === "pause") { const min = Number(t.value) || 0; tag.pausen = min ? [{ start: "12:00", ende: minToZeit(12 * 60 + min) }] : []; }
      else tag[feld] = t.value;
      if (!tag.start && !tag.ende && !tag.status && !tag.notiz && !(tag.pausen || []).length) delete jd.tage[datum]; else jd.tage[datum] = tag;
      jahrSichern(S.mid, S.jahr);
      clearTimeout(window.__zeT); window.__zeT = setTimeout(render, 600);
      return;
    }
  });
  /* Beim Verlassen eines Zeitfelds sauber formatieren. */
  document.addEventListener("change", e => {
    const t = e.target; const ze = document.getElementById("ze"); if (!ze || ze.hidden || !t.classList || !t.classList.contains("z-zeit")) return;
    const wert = zeitNormal(t.value); t.value = wert;
    if (t.dataset.ztagf && S.tagEntwurf) S.tagEntwurf[t.dataset.ztagf] = wert;
    if (t.dataset.zpause && S.tagEntwurf) { const [i, f2] = t.dataset.zpause.split("|"); (S.tagEntwurf.pausen[Number(i)] || {})[f2] = wert; }
    if (t.dataset.zperson && S.mid) { personVon(S.mid)[t.dataset.zperson] = wert; personSichern(S.mid); }
    setTimeout(() => { try { render(); } catch (err) {} }, 0);
  });
  const minToZeit = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

  /* ---------- Start und Brücke ---------- */
  window.Zeiterfassung = {
    zeigen() { render(); },
    async start() {
      const online = await ZSpeicher.verbinden();
      if (!online) return;
      const liste = team();
      for (const m of liste) {
        const d = await ZSpeicher.laden("person-" + m.id); if (d) { S.personen[m.id] = { ...leerePerson(), ...d }; ZSpeicher.lokalSetzen("person-" + m.id, S.personen[m.id]); }
        const j = await ZSpeicher.laden(jahrKey(m.id, S.jahr)); if (j) { S.jahre[jahrKey(m.id, S.jahr)] = j; ZSpeicher.lokalSetzen(jahrKey(m.id, S.jahr), j); }
      }
      if (!document.getElementById("ze").hidden) render();
    }
  };
  setTimeout(() => { try { window.Zeiterfassung.start(); } catch (e) {} }, 800);
})();
</script>

</body>
</html>
