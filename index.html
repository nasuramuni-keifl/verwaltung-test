<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausverwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= Gestaltung (nur Aussehen, keine Logik) ================= */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --field:#F5F7FA; --ink:#1E2533; --muted:#667085; --line:#E3E7ED;
  --accent:#4057C9; --accent-soft:#ECEFFC; --accent-ink:#FFFFFF;
  --miet:#4057C9; --miet-soft:#ECEFFC; --weg:#0F7B6C; --weg-soft:#E2F3EF; --gar:#B25E09; --gar-soft:#FCEFE0;
  --warn:#B7791F; --warn-soft:#FDF4E4; --err:#B42318; --err-soft:#FDECEA;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B1F29; --field:#232835; --ink:#E7EAF0; --muted:#9BA3B4; --line:#2D3342;
  --accent:#8A9BF0; --accent-soft:#252B45; --accent-ink:#11152A;
  --miet:#8A9BF0; --miet-soft:#252B45; --weg:#5CC7B2; --weg-soft:#16302B; --gar:#EAA65A; --gar-soft:#33251A;
  --warn:#E8B964; --warn-soft:#2D2616; --err:#F29B93; --err-soft:#33201F;
}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B1F29; --field:#232835; --ink:#E7EAF0; --muted:#9BA3B4; --line:#2D3342;
  --accent:#8A9BF0; --accent-soft:#252B45; --accent-ink:#11152A;
  --miet:#8A9BF0; --miet-soft:#252B45; --weg:#5CC7B2; --weg-soft:#16302B; --gar:#EAA65A; --gar-soft:#33251A;
  --warn:#E8B964; --warn-soft:#2D2616; --err:#F29B93; --err-soft:#33201F;
}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,4vw,40px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.marke-app{font-weight:700;font-size:17px;letter-spacing:-.01em}
main{padding:8px clamp(16px,4vw,40px) 64px}
.seite{width:100%}
.formular-raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.formular-raster .gruppe{margin-bottom:0}
.formular-raster .voll{grid-column:1/-1}
@media (max-width:900px){.formular-raster{grid-template-columns:1fr}}
.hero{padding:24px 0 20px}
.hero h1{font-size:clamp(28px,4.5vw,40px);line-height:1.12;letter-spacing:-.025em;margin:0 0 8px;font-weight:700}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:56ch}
.btn{border:0;background:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.haupt{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.gefahr{color:var(--err)}
.btn.klein{padding:6px 13px;font-size:13.5px;font-weight:500}
/* Übersicht */
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kachel{text-align:left;border:0;background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.kachel b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.kachel span{color:var(--muted);font-size:14px}
.kachel[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.kachel .punkt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.werkzeug{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.suche{flex:1;min-width:220px}
.suche input{width:100%;padding:11px 16px;border:0;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.suche input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.umschalt{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14.5px}
.info-eingang .t-oben{justify-content:space-between;margin-bottom:8px}
.info-zeile{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--field);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.faellig{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:14px 18px;margin-bottom:16px;font-size:14.5px}
.faellig ul{margin:6px 0 0;padding-left:18px}
.faellig a{color:inherit;font-weight:600}
.faellig button{border:0;background:none;color:inherit;text-decoration:underline;padding:0;font-weight:600}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.karte{text-align:left;border:0;background:var(--surface);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.karte:hover{transform:translateY(-2px);box-shadow:0 12px 28px -18px rgba(20,30,50,.4)}
.karte.beendet{opacity:.6}
.marke{align-self:flex-start;font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:999px}
.m-miet{color:var(--miet);background:var(--miet-soft)} .m-weg{color:var(--weg);background:var(--weg-soft)} .m-garantie{color:var(--gar);background:var(--gar-soft)}
.karte h3{margin:4px 0 0;font-size:18px;line-height:1.3;letter-spacing:-.01em}
.karte .ort{color:var(--muted);font-size:14.5px}
.karte .wer{font-size:14.5px}
.karte .einh{font-size:13.5px;color:var(--muted)}
.karte .fuss{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hinweis-klein{color:var(--warn);font-weight:600}
.hinweis-klein.rot{color:var(--err)}
.leer{background:var(--surface);border-radius:22px;padding:36px;text-align:center;color:var(--muted)}
.leer h2{color:var(--ink);margin:0 0 6px}
/* Formular */
.gruppe{background:var(--surface);border-radius:22px;padding:26px clamp(18px,4vw,32px);margin-bottom:16px}
.gruppe h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.gruppe .unter{color:var(--muted);font-size:14.5px;margin:0 0 18px}
.arten{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.arten button{text-align:left;border:2px solid transparent;background:var(--field);border-radius:16px;padding:16px 18px}
.arten button strong{display:block;font-size:16.5px}
.arten button span{color:var(--muted);font-size:14px}
.arten button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 18px}
.feld{display:grid;gap:6px;align-content:start;min-width:0}
.feld.breit{grid-column:1/-1}
.plz-ort{display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px}
.feld label{font-weight:600;font-size:14.5px}
.feld small{color:var(--muted);font-size:13px;line-height:1.4}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],textarea{width:100%;padding:12px 14px;border:1.5px solid transparent;border-radius:12px;background:var(--field)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{min-height:110px;resize:vertical}
.einheit{position:relative}
.einheit input{padding-right:62px}
.einheit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.e-zeile{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px;align-items:center;margin-bottom:10px}
.e-weg{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px}
.schalter-zeile{display:flex;align-items:center;justify-content:space-between;gap:18px}
.schalter-zeile small{display:block;color:var(--muted);font-size:13px}
.schalter{flex:none;position:relative;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);transition:background .18s}
.schalter::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.schalter[aria-checked="true"]{background:var(--accent)}
.schalter[aria-checked="true"]::after{transform:translateX(22px)}
.meldung{border-radius:14px;padding:12px 16px;font-size:14.5px;margin-top:14px}
#meldungen{margin-top:2px}
.leiste{margin-top:10px}
.meldung.warn{background:var(--warn-soft);color:var(--warn)}
.meldung.fehler{background:var(--err-soft);color:var(--err)}
.leiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 0}
.leiste div{display:flex;gap:10px;flex-wrap:wrap}
.status{color:var(--muted);font-size:12.5px;text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 20px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.an{opacity:1}
@media (max-width:560px){.e-zeile{grid-template-columns:minmax(0,1fr) 100px auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.reiter{display:flex;gap:4px;flex:1;margin-left:18px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.reiter::-webkit-scrollbar{display:none}
.reiter button{border:0;background:none;padding:7px 13px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;flex:0 0 auto}
.reiter button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.08)}
select{width:100%;padding:12px 38px 12px 14px;border:1.5px solid transparent;border-radius:12px;background:var(--field);appearance:none;font:inherit;color:inherit;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select:focus{outline:none;border-color:var(--accent)}
.anlage{background:var(--field);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.anlage input,.anlage select{background:var(--surface)}
.anlage-kopf{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.anlage-titel{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.anlage-schalter{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:2px 0;color:inherit;font:inherit;text-align:left}
.anlage-schalter .chevron{color:var(--muted);font-size:13px;transition:transform .2s}
.anlage.auf .chevron{transform:rotate(180deg)}
.anlage-schalter:hover .chevron{color:var(--ink)}
.anlage-raster{animation:auf .22s ease-out}
.anlage-firma{font-size:13.5px;color:var(--muted)}
.anlage-firma a{color:var(--accent);font-weight:600;text-decoration:none}
.anlage-raster{margin-top:14px}
.anlage-kopf strong{font-size:15.5px}
.anlage-raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 16px}
.hw-kontakt{font-size:13px;color:var(--muted)}
.hw-kontakt a{color:var(--accent);font-weight:600;text-decoration:none}
.hw-neu{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:14px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.hw-neu input{background:var(--field)}
.hw-neu .leiste{grid-column:1/-1;padding:0;margin:0}
.intervall-hinweis{grid-column:1/-1;font-size:13px;color:var(--muted);margin:-4px 0 0}
.wartung-status{font-size:13px;font-weight:600}
.wartung-status.warn{color:var(--warn)} .wartung-status.rot{color:var(--err)}
.hw-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.hw-karte{background:var(--surface);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.hw-karte h3{margin:0;font-size:17px}
.hw-karte .gewerk{align-self:flex-start;font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.hw-karte .zeile{font-size:14.5px}
.hw-karte .zeile a{color:inherit}
.iban-status{font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
.iban-status.einmalig{background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:10px;line-height:1.7}
.iban-status.einmalig a{color:var(--accent);font-weight:600}
.iban-status.einmalig .btn{margin-left:4px;display:inline-block;white-space:nowrap;cursor:pointer}
.iban-status.ok{color:var(--weg);font-weight:600} .iban-status.rot{color:var(--err);font-weight:600}
.bankverz{margin-top:22px}
.konto-felder{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.2fr)}
@media (max-width:800px){.konto-felder{grid-template-columns:1fr 1fr}}
.bankverz ol{margin:8px 0 14px;padding-left:20px;font-size:14.5px}
.bankverz a{color:var(--accent);font-weight:600}
.bank-stand{font-size:14.5px;margin:0 0 10px}
.segment{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--field);border-radius:999px;padding:4px;justify-self:start}
.segment button{border:0;background:none;padding:7px 16px;border-radius:999px}
.segment button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(20,30,50,.1)}
.u-detail{background:var(--field);border-radius:16px;padding:16px 18px 18px;margin:0 0 16px}
.u-spalten{display:grid;grid-template-columns:1fr;gap:14px}
.u-block{background:var(--surface);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.u-block h3{font-size:15.5px;margin:0 0 12px}
.u-block-kopf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.u-block-kopf h3{margin:0}
.u-block-kopf select{max-width:260px}
.obj-nr{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 8px;vertical-align:2px;margin-right:6px}
.u-name{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-name em{color:var(--muted);font-style:normal}
.einh-zeile.offen{background:var(--field);border-radius:12px 12px 0 0;padding:10px 10px 4px;margin-bottom:0}
.abr-unter{margin-top:14px}
.abr-label{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}
.abr-unter small{display:block;color:var(--muted);font-size:13px;margin-top:6px;line-height:1.4}
.pz-zeile{display:grid;grid-template-columns:150px 190px 34px;gap:10px;align-items:center;margin-bottom:8px}
.mieter-zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mieter-zeile select{max-width:340px}
.mieter-neu{margin-top:12px}
@media (max-width:640px){.pz-zeile{grid-template-columns:1fr 1fr 30px}}
.abr-einheit{background:var(--field);border-radius:16px;padding:16px 18px;margin-top:12px}
.abr-einheit input{background:var(--surface)}
.abr-kopf{font-size:15px;margin-bottom:12px}
.u-eig{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 6px;font-size:16px;line-height:1}
.einh-kopf.nur-eig,.einh-zeile.nur-eig{grid-template-columns:86px minmax(0,1fr) minmax(0,1fr) 64px 78px minmax(0,1.6fr) 86px 30px}
.hwk-zeile{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 30px;gap:10px;align-items:center;margin-bottom:10px}
@media (max-width:820px){.hwk-zeile{grid-template-columns:1fr 1fr 30px}}
.pillen{display:flex;gap:10px;flex-wrap:wrap}
.pille{border:0;background:var(--field);border-radius:14px;padding:12px 18px;font-weight:600;font-size:15px;text-align:left;box-shadow:inset 0 0 0 2px transparent}
.pille small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.pille.an{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pille.an small{color:var(--accent)}
.t-liste{display:grid;gap:12px}
.zeit-pillen{margin-bottom:14px}
.zeit-pillen .pille{padding:9px 16px;font-size:14.5px}
.kal-kopf{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.kal-kopf h2{margin:0;font-size:19px;min-width:190px}
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.kal-wt{font-size:12.5px;font-weight:600;color:var(--muted);padding:0 4px 2px}
.kal.kal-woche{grid-template-rows:auto 1fr}
.kal.kal-woche .kal-tag{min-height:300px}
.kal.kal-woche .kal-t{white-space:normal}
.kal.kal-woche .kal-t small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.kal-tag{background:var(--surface);border-radius:12px;min-height:104px;padding:8px;display:flex;flex-direction:column;gap:4px}
.kal-tag.fremd{opacity:.45}
.kal-tag.heute{box-shadow:inset 0 0 0 2px var(--accent)}
.kal-nr{font-size:12.5px;font-weight:600;color:var(--muted)}
.kal-t{border:0;border-radius:8px;padding:4px 7px;font-size:12.5px;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--field);color:var(--ink)}
.kal-t.fertig{text-decoration:line-through;opacity:.6}
.t-termin{font-size:13px;font-weight:600;color:var(--accent)}
@media (max-width:820px){.kal{grid-template-columns:1fr;gap:6px}.kal-wt{display:none}.kal-tag{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .kal-tag:not(:has(.kal-t)){display:none}}
.ein-liste{margin:6px 0 10px;padding-left:20px;font-size:14.5px;line-height:1.6}
.t-gruppe{font-size:17px;margin:26px 0 12px}
.ich-bin{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
.ich-bin select{width:auto;min-width:190px}
.t-karte{text-align:left;border:0;background:var(--surface);border-radius:18px;padding:16px 20px;display:grid;gap:6px}
.t-karte:hover{box-shadow:0 10px 24px -18px rgba(20,30,50,.5)}
.t-karte h3{margin:2px 0 0;font-size:17px}
.t-vorschau{margin:0;color:var(--muted);font-size:14.5px}
.t-oben,.t-kopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t-text{white-space:pre-wrap;font-size:15.5px;margin:14px 0 0}
a.btn{text-decoration:none;display:inline-block}
.mails{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mail{background:var(--field);border-radius:14px;overflow:hidden;border-left:4px solid var(--accent)}
.mail.aus{border-left-color:var(--weg)}
.mail-kopf{display:grid;grid-template-columns:110px minmax(0,1fr) auto 20px;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px 14px;text-align:left;font:inherit;color:inherit}
.mail-pfeil{font-size:13px;font-weight:600;color:var(--muted)}
.mail-betreff{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-text{padding:0 14px 14px;font-size:14.5px;white-space:pre-wrap}
@media (max-width:700px){.mail-kopf{grid-template-columns:1fr 20px}}
.verlauf{list-style:none;margin:0;padding:0;display:grid;gap:12px;font-size:14.5px}
.verlauf li{background:var(--field);border-radius:12px;padding:12px 14px}
.v-kopf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}

<!-- ================= Modul: Speicher (Objekte und Handwerker sichern und laden) ================= -->
<script>
const Speicher = (() => {
  let db = null;
  const lokal = k => { try { return JSON.parse(localStorage.getItem("ov_" + k) || "[]"); } catch (e) { return []; } };
  const lokalSetzen = (k, liste) => { try { localStorage.setItem("ov_" + k, JSON.stringify(liste)); } catch (e) {} };
  async function verbinden() {
    try { if (!window.claude || typeof window.claude.use !== "function") return false; db = await window.claude.use("db"); return !!db; }
    catch (e) { db = null; return false; }
  }
  /* Meldet jede Änderung einer Sammlung ("objekte" oder "handwerker"); einmal je Sammlung abonnieren. */
  function beobachten(sammlung, rueckruf, fehler) {
    if (!db) return () => {};
    return db.collection(sammlung).onSnapshot(
      snap => rueckruf(snap.docs.map(d => ({ ...JSON.parse(JSON.stringify(d.data())), id: d.id }))),
      e => fehler && fehler(e));
  }
  async function speichern(sammlung, obj, liste) {
    const { id, ...daten } = obj; daten.geaendert = new Date().toISOString();
    lokalSetzen(sammlung, liste);
    if (db) await db.collection(sammlung).doc(id).set(daten);
  }
  async function loeschen(sammlung, id, liste) { lokalSetzen(sammlung, liste); if (db) await db.collection(sammlung).doc(id).delete(); }
  /* Bankverzeichnis: nach erster BLZ-Ziffer in kleine Teile zerlegt (Größenlimit je Dokument). */
  async function bankTeil(z) {
    if (db) { try { const s = await db.doc("bankverzeichnis/teil" + z).get(); return s.exists ? JSON.parse(JSON.stringify(s.data().e || {})) : null; } catch (e) { return null; } }
    try { return (JSON.parse(localStorage.getItem("ov_bank") || "{}"))[z] || null; } catch (e) { return null; }
  }
  async function bankInfo() {
    if (db) { try { const s = await db.doc("bankverzeichnis/info").get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; } catch (e) { return null; } }
    try { return JSON.parse(localStorage.getItem("ov_bankinfo") || "null"); } catch (e) { return null; }
  }
  async function bankSpeichern(teile, info) {
    try { localStorage.setItem("ov_bank", JSON.stringify(teile)); localStorage.setItem("ov_bankinfo", JSON.stringify(info)); } catch (e) {}
    if (db) { for (let z = 0; z <= 9; z++) await db.doc("bankverzeichnis/teil" + z).set({ e: teile[z] || {} }); await db.doc("bankverzeichnis/info").set(info); }
  }
  return { lokal, lokalSetzen, verbinden, beobachten, speichern, loeschen, bankTeil, bankInfo, bankSpeichern, online: () => !!db };
})();
</script>

<!-- ================= Modul: Objektlogik (Regeln und Berechnungen, ohne Oberfläche) ================= -->
<script>
const Objekte = (() => {
  const ARTEN = {
    miet: { name: "Mietverwaltung", text: "Verwaltung vermieteter Wohnungen oder Häuser für Eigentümer" },
    weg: { name: "WEG-Verwaltung", text: "Verwaltung für eine Gemeinschaft der Wohnungseigentümer" },
    garantie: { name: "Garantiemiete", text: "Sie garantieren dem Eigentümer eine feste Monatsmiete" }
  };
  /* Übliche Prüf- und Wartungsrhythmen als Vorschlag (Monate). */
  const ANLAGEN = {
    "Aufzug": { intervall: 24, hinweis: "Hauptprüfung durch eine zugelassene Überwachungsstelle alle 2 Jahre (§ 16 BetrSichV), dazwischen Zwischenprüfung." },
    "Rauchwarnmelder": { intervall: 12, hinweis: "Jährliche Inspektion und Wartung (DIN 14676)." },
    "Trinkwasser (Legionellen)": { intervall: 36, hinweis: "Bei Großanlagen mit Duschen: Untersuchung mindestens alle 3 Jahre (TrinkwV)." },
    "Heizung": { intervall: 12, hinweis: "Jährliche Wartung empfohlen; Messungen durch den Schornsteinfeger nach Feuerstättenbescheid." },
    "Feuerlöscher": { intervall: 24, hinweis: "Prüfung durch Sachkundigen alle 2 Jahre." },
    "Hebeanlage": { intervall: 6, hinweis: "Im Mehrfamilienhaus halbjährliche Wartung (DIN EN 12056-4)." },
    "Lüftungsanlage": { intervall: 12, hinweis: "" }, "Photovoltaik": { intervall: 48, hinweis: "" }, "Garagentor": { intervall: 12, hinweis: "" },
    "Blitzschutz": { intervall: 24, hinweis: "" }, "Brandmeldeanlage": { intervall: 12, hinweis: "" }
  };
  const plusMonate = (iso, m) => { const d = new Date(iso + "T12:00:00"); const tag = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + Number(m));
    d.setDate(Math.min(tag, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return d.toISOString().slice(0, 10); };
  const neueId = () => (crypto.randomUUID ? crypto.randomUUID() : "o" + Date.now() + Math.random().toString(16).slice(2));
  const leer = () => ({ id: neueId(), art: "", bezeichnung: "", strasse: "", plz: "", ort: "", auftraggeber: "", ansprechpartner: "", telefon: "", email: "",
    nummer: "", provision: "", baujahr: "", ausweisArt: "", energiewert: "", energietraeger: "", effizienz: "", dokumente: [], einheiten: [], einheitenListe: [], beirat: [], anlagen: [], betreuerIds: [], buchhaltungId: "", technikId: "", beginn: "", ende: "", garantiemiete: "", notizen: "", beendet: false, erstellt: new Date().toISOString() });
  const datum = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return d + "." + m + "." + y; };
  const tageBis = iso => iso ? Math.ceil((new Date(iso + "T12:00:00") - new Date(new Date().toDateString() + " 12:00")) / 864e5) : null;
  const summeEinheiten = o => (o.einheiten || []).reduce((n, e) => n + (Number(e.anzahl) || 0), 0);
  const einheitenText = o => (o.einheiten || []).filter(e => Number(e.anzahl) > 0).map(e => e.anzahl + " × " + (e.art || "Einheit")).join(" · ");
  /* Hinweis zum Vertragsende: WEG-Wiederbestellung frühestens 1 Jahr vor Ablauf (§ 26 Abs. 2 WEG). */
  const heuteIso = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  /* Objekte, deren Bestellung bzw. Vertrag ausgelaufen ist, werden automatisch beendet (Stichtag: Tag nach dem Vertragsende). */
  function automatischBeenden(liste) {
    const heute = heuteIso(); const geaendert = [];
    liste.forEach(o => { if (!o.beendet && o.ende && o.ende < heute) { o.beendet = true; o.beendetAm = o.ende; o.beendetAutomatisch = true; geaendert.push(o); } });
    return geaendert;
  }
  /* Kürzlich (letzte 30 Tage) automatisch beendete Objekte – zur Kontrolle in der Übersicht. */
  const kuerzlichBeendet = liste => liste.filter(o => o.beendet && o.beendetAutomatisch && o.beendetAm && tageBis(o.beendetAm) >= -30);
  function fristHinweis(o) {
    if (o.beendet || !o.ende) return null;
    const t = tageBis(o.ende);
    if (t < 0) return { stufe: "rot", text: "Vertrag abgelaufen am " + datum(o.ende) };
    if (o.art === "weg" && t <= 365) return { stufe: "warn", text: "Bestellung endet am " + datum(o.ende) + " – Wiederbestellung auf die nächste Versammlung setzen" };
    if (t <= 183) return { stufe: "warn", text: "Vertrag endet am " + datum(o.ende) };
    return null;
  }
  /* Fällige oder überfällige Prüfungen der nächsten 30 Tage über alle aktiven Objekte. */
  function wartungen(liste) {
    const aus = [];
    liste.filter(o => !o.beendet).forEach(o => (o.anlagen || []).forEach(a => {
      if (!a.naechste) return; const t = tageBis(a.naechste);
      if (t <= 30) aus.push({ objekt: o, anlage: a, tage: t });
    }));
    return aus.sort((x, y) => x.tage - y.tage);
  }
  function pruefen(o) {
    const fehler = [], warn = [];
    if (!o.art) fehler.push("Bitte wählen Sie eine Verwaltungsart.");
    if (!o.strasse || !o.ort) fehler.push("Bitte Straße und Ort des Objekts eintragen.");
    if (o.plz && !/^\d{5}$/.test(o.plz)) warn.push("Die Postleitzahl hat nicht fünf Ziffern.");
    if (o.beginn && o.ende && o.ende < o.beginn) fehler.push("Das Vertragsende liegt vor dem Beginn.");
    if (!o.beendet && o.ende && o.ende < heuteIso()) fehler.push((o.art === "weg" ? "Die Bestellung" : "Der Vertrag") + " ist am " + datum(o.ende) +
      " ausgelaufen. Tragen Sie das neue Ende ein (z. B. nach der Wiederbestellung) – sonst wird das Objekt automatisch beendet.");
    if (o.art === "weg" && o.beginn && o.ende) {
      const max = new Date(o.beginn + "T12:00:00"); max.setFullYear(max.getFullYear() + 5);
      if (new Date(o.ende + "T12:00:00") > max) warn.push("Eine WEG-Bestellung darf höchstens fünf Jahre dauern (§ 26 Abs. 2 WEG).");
    }
    if (o.art === "garantie" && !o.garantiemiete) warn.push("Die garantierte Monatsmiete fehlt noch.");
    if (o.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email)) warn.push("Die E-Mail-Adresse sieht unvollständig aus.");
    if (o.art === "weg") { const ohne = (o.einheitenListe || []).filter(e => !e.eigentuemerId).length; if (ohne) warn.push(ohne + (ohne === 1 ? " Einheit hat" : " Einheiten haben") + " noch keinen Eigentümer."); }
    (o.anlagen || []).forEach(a => { if ((a.art || a.standort) && !a.handwerkerId) warn.push("Für „" + (a.art || a.standort) + "“ ist noch kein Handwerker hinterlegt."); });
    return { fehler, warn };
  }
  function filtern(liste, { art, suche, beendete }) {
    const q = (suche || "").trim().toLowerCase();
    return liste.filter(o => (beendete || !o.beendet) && (!art || o.art === art) &&
      (!q || [o.nummer, o.bezeichnung, o.strasse, o.plz, o.ort, o.auftraggeber, o.ansprechpartner, betreuerNamen(o)].join(" ").toLowerCase().includes(q)))
      .sort((a, b) => (a.ort || "").localeCompare(b.ort || "", "de") || (a.strasse || "").localeCompare(b.strasse || "", "de", { numeric: true }));
  }
  function zahlen(liste) {
    const aktiv = liste.filter(o => !o.beendet);
    return { gesamt: aktiv.length, miet: aktiv.filter(o => o.art === "miet").length, weg: aktiv.filter(o => o.art === "weg").length,
      garantie: aktiv.filter(o => o.art === "garantie").length, einheiten: aktiv.reduce((n, o) => n + summeEinheiten(o), 0) };
  }
  /* IBAN prüfen (Länge je Land + Prüfziffer nach ISO 13616) und lesbar formatieren. */
  const IBAN_LAENGE = { DE: 22, AT: 20, CH: 21, LI: 21, LU: 20, NL: 18, BE: 16, FR: 27, IT: 27, ES: 24, PL: 28, CZ: 24, DK: 18 };
  const ibanRoh = t => String(t || "").replace(/\s+/g, "").toUpperCase();
  const ibanFormat = t => ibanRoh(t).replace(/(.{4})/g, "$1 ").trim();
  function ibanGueltig(t) {
    const i = ibanRoh(t); if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(i)) return false;
    if (IBAN_LAENGE[i.slice(0, 2)] && i.length !== IBAN_LAENGE[i.slice(0, 2)]) return false;
    const z = (i.slice(4) + i.slice(0, 4)).replace(/[A-Z]/g, c => String(c.charCodeAt(0) - 55));
    let rest = 0; for (const ch of z) rest = (rest * 10 + Number(ch)) % 97; return rest === 1;
  }
  const bicGueltig = t => !t || /^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$/.test(String(t).replace(/\s+/g, "").toUpperCase());
  function handwerkerPruefen(w) {
    const f = [];
    if (!String(w.firma || "").trim()) f.push("Bitte den Namen der Firma eintragen.");
    if (w.iban && !ibanGueltig(w.iban)) f.push("Die IBAN ist nicht gültig – bitte auf Tippfehler prüfen.");
    if (!bicGueltig(w.bic)) f.push("Die BIC hat nicht das richtige Format (8 oder 11 Zeichen).");
    return f;
  }
  /* Liest die Bankleitzahlendatei der Bundesbank (TXT mit festen Spalten oder CSV). Nur Hauptstellen (Merkmal 1). */
  function bankverzeichnisLesen(text) {
    const zeilen = text.split(/\r?\n/).filter(z => z.trim()); if (!zeilen.length) return null;
    const csv = /;/.test(zeilen[0]) && /bankleitzahl/i.test(zeilen[0]); let idx = null;
    if (csv) { const h = zeilen[0].split(";").map(x => x.replace(/"/g, "").trim().toLowerCase()); const f = n => h.findIndex(x => x.startsWith(n));
      idx = { blz: f("bankleitzahl"), m: f("merkmal"), name: f("bezeichnung"), ort: f("ort"), bic: f("bic") }; if (Object.values(idx).some(i => i < 0)) return null; }
    const teile = {}; let n = 0, m1 = 0, bicOk = 0;
    for (const z of csv ? zeilen.slice(1) : zeilen) {
      let blz, m, name, ort, bic;
      if (csv) { const c = z.split(";").map(x => x.replace(/^"|"$/g, "").trim()); [blz, m, name, ort, bic] = [c[idx.blz], c[idx.m], c[idx.name], c[idx.ort], c[idx.bic]]; }
      else { if (z.length < 150) continue; blz = z.slice(0, 8); m = z[8]; name = z.slice(9, 67).trim(); ort = z.slice(72, 107).trim(); bic = z.slice(139, 150).trim(); }
      if (!/^\d{8}$/.test(blz || "") || m !== "1") continue; m1++;
      if (bic && /^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$/.test(bic)) bicOk++;
      (teile[blz[0]] = teile[blz[0]] || {})[blz] = [bic || "", name || "", ort || ""]; n++;
    }
    if (!n || bicOk < m1 * 0.5) return null;
    return { teile, anzahl: n };
  }
  /* ---------- Eigentümer und Mieter ---------- */
  const mitarbeiterName = m => [m.vorname, m.nachname].filter(Boolean).join(" ") || "Ohne Namen";
  const personName = p => p.firma || [p.vorname, p.nachname].filter(Boolean).join(" ") || "Ohne Namen";
  const ehemalig = p => (p.rolle === "mieter" ? !!p.mietende && p.mietende < heuteIso() : !!p.eigentumBis && p.eigentumBis < heuteIso());
  /* Personenanzahl kann sich ändern – je Eintrag ein Beginn (wichtig für Abrechnungen nach Personen). */
  const personenListe = e => (e.personenListe && e.personenListe.length ? e.personenListe : [{ anzahl: e.personen || "", ab: "" }]);
  const personenAktuell = e => { const l = personenListe(e).filter(x => x.anzahl).sort((a, b) => String(a.ab).localeCompare(String(b.ab)));
    const gueltig = l.filter(x => !x.ab || x.ab <= heuteIso()); return (gueltig.length ? gueltig[gueltig.length - 1] : l[0] || {}).anzahl || ""; };
  function personPruefen(p) {
    const f = [];
    if (!String(p.nachname || "").trim() && !String(p.firma || "").trim()) f.push("Bitte Nachname oder Firma eintragen.");
    if (p.iban && !ibanGueltig(p.iban)) f.push("Die IBAN ist nicht gültig – bitte auf Tippfehler prüfen.");
    if (p.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.email)) f.push("Die E-Mail-Adresse sieht unvollständig aus.");
    if (p.rolle === "mieter" && p.mietbeginn && p.mietende && p.mietende < p.mietbeginn) f.push("Das Mietende liegt vor dem Mietbeginn.");
    if (p.rolle === "eigentuemer" && p.eigentumSeit && p.eigentumBis && p.eigentumBis < p.eigentumSeit) f.push("Das Ende des Eigentums liegt vor dem Beginn.");
    if (p.mandat && !p.iban) f.push("Für ein SEPA-Lastschriftmandat wird die IBAN benötigt.");
    return f;
  }
  /* ---------- Einzelne Einheiten (WE 1, SP 3 …) ---------- */
  const KUERZEL = { "wohnung": "WE", "gewerbeeinheit": "GE", "stellplatz": "SP", "tiefgaragenstellplatz": "TG", "garage": "Garage" };
  const kuerzel = art => KUERZEL[String(art || "").toLowerCase()] || (art || "Einheit");
  const neueEinheit = (x = {}) => ({ id: neueId(), nr: "", art: "Wohnung", lage: "", flaeche: "", mea: "", eigentuemerId: "", personen: "",
    hausgeld: "", ruecklage: "", sollmiete: "", zKalt: "", zWarm: "", zHeiz: "", zStrom: "", personenListe: [], uBk: "", uHeiz: "", uWasser: "", uProzent: "", ...x });
  /* n Einheiten einer Art anlegen und fortlaufend nummerieren (setzt vorhandene Nummern fort). */
  function einheitenErzeugen(liste, art, anzahl) {
    const k = kuerzel(art); const re = new RegExp("^" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*(\\d+)$", "i");
    let start = liste.reduce((m, e) => { const t = re.exec(e.nr || ""); return t ? Math.max(m, Number(t[1])) : m; }, 0);
    return Array.from({ length: Math.max(0, Math.min(500, Number(anzahl) || 0)) }, () => neueEinheit({ art, nr: k + " " + (++start) }));
  }
  /* Ältere Objekte hatten nur Stückzahlen: daraus einmalig eine Einzelliste machen. */
  /* Frühere Fassung kannte nur eine Betreuung – daraus wird eine Liste. */
  function betreuungSicherstellen(o) {
    if (!Array.isArray(o.betreuerIds)) o.betreuerIds = o.betreuerId ? [o.betreuerId] : [];
    return o;
  }
  /* Objektnummer: zwei Buchstaben der Straße + fortlaufende dreistellige Nummer, z. B. LI-001. */
  function nummernKuerzel(strasse) {
    const rein = String(strasse || "").toUpperCase().replace(/Ä/g, "AE").replace(/Ö/g, "OE").replace(/Ü/g, "UE").replace(/ß/g, "SS").replace(/[^A-Z]/g, "");
    return (rein.slice(0, 2) || "XX").padEnd(2, "X");
  }
  function objektNummer(liste, strasse, eigeneId) {
    const k = nummernKuerzel(strasse); const re = new RegExp("^" + k + "-(\\d{3})$");
    const hoechste = liste.filter(o => o.id !== eigeneId).reduce((m, o) => { const t = re.exec(String(o.nummer || "")); return t ? Math.max(m, Number(t[1])) : m; }, 0);
    return k + "-" + String(hoechste + 1).padStart(3, "0");
  }
  function listeSicherstellen(o) {
    if (Array.isArray(o.einheitenListe) && o.einheitenListe.length) return o;
    o.einheitenListe = []; (o.einheiten || []).forEach(e => { o.einheitenListe.push(...einheitenErzeugen(o.einheitenListe, e.art || "Einheit", e.anzahl)); });
    return o;
  }
  /* Stückzahlen je Art aus der Einzelliste (für Übersicht und Verträge). */
  function zaehlen(liste) {
    const m = new Map(); (liste || []).forEach(e => { const a = e.art || "Einheit"; m.set(a, (m.get(a) || 0) + 1); });
    return [...m].map(([art, n]) => ({ art, anzahl: String(n) }));
  }
  const meaWert = t => { const m = String(t || "").replace(",", ".").match(/^\s*([\d.]+)/); return m ? Number(m[1]) : null; };
  function meaSumme(liste) { const w = (liste || []).map(e => meaWert(e.mea)).filter(x => x !== null); return w.length ? Math.round(w.reduce((a, b) => a + b, 0) * 1000) / 1000 : null; }
  /* Umlageschlüssel: gesetzliche Grundregeln – WEG nach Miteigentumsanteilen (§ 16 Abs. 2 WEG),
     Mietverhältnisse nach Wohnfläche (§ 556a BGB), Heizung überwiegend nach Verbrauch (§ 7 HeizkostenV). */
  const SCHLUESSEL = { flaeche: "Wohnfläche (m²)", mea: "Miteigentumsanteile", personen: "Personenanzahl", einheit: "Anzahl Einheiten", verbrauch: "Verbrauch (Zähler)", fest: "Fester Anteil (%)" };
  const KOSTENARTEN = [["uBk", "Betriebskosten allgemein"], ["uHeiz", "Heizung und Warmwasser"], ["uWasser", "Wasser und Abwasser"]];
  const schluesselStandard = (o, feld) => o[feld] || (feld === "uHeiz" ? "verbrauch" : feld === "uWasser" ? (o.art === "weg" ? "verbrauch" : "verbrauch") : (o.art === "weg" ? "mea" : "flaeche"));
  const schluesselFuer = (o, e, feld) => e[feld] || schluesselStandard(o, feld);
  /* ---------- Tickets ---------- */
  const KATEGORIEN = [["rueckruf", "Rückruf"], ["schaden", "Schadensmeldung"], ["reparatur", "Reparatur"], ["beschwerde", "Beschwerde"],
    ["anfrage", "Anfrage / Auskunft"], ["termin", "Handwerkertermin"], ["abrechnung", "Abrechnung"], ["unterlagen", "Unterlagen angefordert"], ["wechsel", "Mieter-/Eigentümerwechsel"],
    ["mietanfrage", "Mietanfrage"], ["schaedlinge", "Schädlingsbefall"], ["beschluss", "Beschlussumsetzung"], ["neuvermietung", "Neuvermietung"], ["sonstiges", "Sonstiges"]];
  const DRINGLICHKEIT = [["notfall", "Notfall", "Gefahr im Verzug – sofort handeln"], ["hoch", "Hoch", "heute oder morgen"], ["normal", "Normal", "diese Woche"], ["niedrig", "Niedrig", "wenn Zeit ist"]];
  const STATUS = [["neu", "Neu"], ["arbeit", "In Arbeit"], ["warten", "Wartet auf Rückmeldung"], ["erledigt", "Erledigt"]];
  const label = (liste, wert) => (liste.find(x => x[0] === wert) || [])[1] || "";
  function ticketNummer(liste) {
    const jahr = new Date().getFullYear();
    const hoechste = liste.filter(t => String(t.nr || "").startsWith(jahr + "-")).reduce((m, t) => Math.max(m, Number(String(t.nr).split("-")[1]) || 0), 0);
    return jahr + "-" + String(hoechste + 1).padStart(3, "0");
  }
  function ticketPruefen(t) {
    const f = [];

    const ohne = alle.filter(t => !t.termin && Objekte.offen(t));
    let tage, titel, monat = d0.getMonth();
    if (woche) {
      const start = new Date(d0); start.setHours(12, 0, 0, 0); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
      tage = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });

  /* ---------- Rechnungseingang: viele Rechnungen auf einmal ---------- */
  function ticketSuchen(text, werte) {
    const t = String(text || "") + " " + Object.values(werte || {}).join(" ");
    const roh = t.replace(/\s|-/g, "").toLowerCase();
    const offene = S.tickets.filter(x => Objekte.ticketStatus(x) !== "erledigt");
    const alle = S.tickets;
    /* 1. Ticket- bzw. Auftragsnummer im Text – eindeutig, wird selbst zugeordnet */
    const nrTreffer = alle.find(x => x.nr && roh.includes(String(x.nr).replace(/-/g, "").toLowerCase()));
    if (nrTreffer) return { ticket: nrTreffer, wie: "Auftragsnummer " + nrTreffer.nr, sicher: true };
    /* 2. Objektnummer plus offener Auftrag */
    const obj = S.liste.find(o => o.nummer && roh.includes(String(o.nummer).replace(/-/g, "").toLowerCase()));
    const lieferant = String((werte || {}).lieferant || "").toLowerCase();
    const hw = lieferant ? S.handwerker.find(w => w.firma && lieferant.includes(String(w.firma).toLowerCase().split(" ")[0])) : null;
    const mitAuftrag = offene.filter(x => (x.dokumente || []).some(d => d.art === "Auftrag" &&

  function rechnungLesen(text) {
    const t = String(text || "").replace(/\u00a0/g, " ");
    const zeilen = t.split(/\n|\r/);
    const nummer = (/(?:Rechnungs-?\s*(?:nr|nummer)\.?|Rechnung\s*Nr\.?|Rg\.?-?Nr\.?|Beleg-?\s*Nr\.?|Invoice\s*No\.?)\s*[:.]?\s*([A-Za-z0-9][A-Za-z0-9\-\/]{2,24})/i.exec(t) || [])[1] || "";
    const datumRoh = (/(?:Rechnungs-?\s*datum|Datum|Belegdatum)\s*[:.]?\s*(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4})/i.exec(t) || [])[1] ||
      (/(\d{1,2}\.\d{1,2}\.\d{4})/.exec(t) || [])[1] || "";
    const datum = (() => { const m = /(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/.exec(datumRoh); if (!m) return "";
      const j = m[3].length === 2 ? "20" + m[3] : m[3];
      return j + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0"); })();
    const betragNach = re => { for (const z of zeilen) { const m = re.exec(z); if (!m) continue;
        const rest = z.slice(m.index + m[0].length); const w = (rest.match(/(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+,\d{2})/) || [])[0];
        if (w) return betragZahl(w); } return 0; };
    /* Letzter Ausweg: der größte Betrag im hinteren Teil der Rechnung. */
    const groessterAmEnde = () => {
      const hinten = zeilen.slice(Math.floor(zeilen.length / 2)).join(" ");
      const alle = (hinten.match(/\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+,\d{2}/g) || []).map(betragZahl);
      return alle.length ? Math.max(...alle) : 0;
    };
    const brutto = betragNach(/(?:gesamtbetrag|rechnungsbetrag|endbetrag|zu zahlen(?:der betrag)?|bruttobetrag|gesamt\s*brutto|zahlbetrag|endsumme|rechnungssumme|gesamtsumme|total)/i) ||
      betragNach(/(?:summe|gesamt|betrag)/i) || groessterAmEnde();
    const lieferant = (zeilen.map(z => z.trim()).find(z => z.length < 70 &&
      (/(GmbH|mbH|GbR|OHG|e\.\s?K\.|Meisterbetrieb|Handwerk|Innung)/i.test(z) || /\b(AG|KG|UG)\b/.test(z))) || "").slice(0, 60);
    const leistung = (zeilen.map(z => z.trim())
      .find(z => /(reparatur|wartung|montage|austausch|instandsetzung|prüfung|arbeitszeit|material|leistung|sanierung|reinigung)/i.test(z) && z.length > 8) || "")
      .replace(/\s*\d{1,3}(?:[.\s]\d{3})*,\d{2}\s*€?\s*$/, "").replace(/^\s*(Pos\.?\s*\d+|\d+[.)])\s*/i, "").trim().slice(0, 90);
    const email = (/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.exec(t) || [])[0] || "";
    const telefon = (/(?:Tel(?:efon)?\.?|Fon)\s*[:.]?\s*([+0-9][0-9 ()\/\-]{6,})/i.exec(t) || [])[1] || "";
    const iban = ((/\bDE\s?[0-9]{2}(?:\s?[0-9]{4}){4}\s?[0-9]{2}\b/.exec(t) || [])[0] || "").replace(/\s+/g, " ").trim();
    const ustid = (/\bDE\s?[0-9]{9}\b/.exec(t) || [])[0] || "";
    const anschrift = (() => { const i2 = zeilen.findIndex(z => lieferant && z.includes(lieferant.slice(0, 12)));
      if (i2 < 0) return { strasse: "", plzOrt: "" };
      const naechste = zeilen.slice(i2 + 1, i2 + 5).map(z => z.trim()).filter(Boolean);
      return { strasse: naechste.find(z => /\d+\s*[a-z]?$/i.test(z) && /[A-Za-zäöüß]/.test(z)) || "",
        plzOrt: naechste.find(z => /^\d{5}\s+\S/.test(z)) || "" }; })();
    return { nummer, datum, email, telefon, iban, ustid, strasse: anschrift.strasse, plzOrt: anschrift.plzOrt,
      brutto: brutto ? brutto.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "", lieferant, leistung };
  }

  /* Gehaltsabrechnung einlesen: Person, Monat und Nettobetrag übernehmen. */
  function lohnLesen(text) {
    const t = String(text || "").replace(/\u00a0/g, " ");
    const zahlen = zeile => (zeile.match(/(\d{1,3}(?:\.\d{3})*,\d{2})/g) || []).map(x => eurZahl(x));
    const zeilen = t.split(/\n|\r/);
    const treffer = [];
    const stark = /auszahlungsbetrag|auszahlung|überweisungsbetrag|nettoverdienst|netto-verdienst|netto\s*bezug|nettoentgelt|netto\s*verdienst|auszahlbetrag/i;
    const schwach = /netto/i;
    /* Der Betrag direkt hinter dem Stichwort zählt, nicht der größte der Zeile. */
    const nachStichwort = (z, re) => { const m = re.exec(z); if (!m) return 0;
      const rest = z.slice(m.index + m[0].length); const w = (rest.match(/(\d{1,3}(?:\.\d{3})*,\d{2})/) || [])[0];
      return w ? eurZahl(w) : 0; };
    zeilen.forEach(z => {
      if (!zahlen(z).length) return;
      if (/jahr(es)?|kumuliert/i.test(z)) return;
      const stw = nachStichwort(z, stark);
      if (stw) { treffer.push({ wert: stw, rang: 2 }); return; }
      if (/brutto/i.test(z)) return;
      const sw = nachStichwort(z, schwach);
      if (sw) treffer.push({ wert: sw, rang: 1 });
    });
    treffer.sort((a, b) => b.rang - a.rang || b.wert - a.wert);
    const netto = treffer.length ? treffer[0].wert : 0;
    const mon = /(0[1-9]|1[0-2])[\.\/](20\d{2})/.exec(t) ||
      /(Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s*(20\d{2})/i.exec(t);
    const monat = mon ? (mon[1].length === 2 ? mon[1] + "/" + mon[2] : mon[1] + " " + mon[2]) : "";
    const stop = /brutto|netto|entgelt|abrechnung|gesamt|steuer|lohn|gehalt|verdienst|auszahlung|betrag|summe|beitrag/i;
    let person = "";
    for (const z of zeilen) {
      const m2 = /(?:Herrn?|Frau)\s+([A-ZÄÖÜ][a-zäöüß\-]+(?:\s+[A-ZÄÖÜ][a-zäöüß\-]+)?)/.exec(z);
      if (m2) { person = m2[1].split(/\s+/).filter(x => !stop.test(x)).join(" "); if (person) break; }
    }
    return { netto: netto ? netto.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "", monat, person };
  }

  /* ---------- Energieausweis auslesen ---------- */
  let pdfLib = null; let pdfFehler = "";
  const PDF_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  async function pdfLaden() {
    if (pdfLib) return pdfLib;
    try {
      await new Promise((ok, weg) => { const sk = document.createElement("script");
        sk.src = PDF_CDN + "pdf.min.js"; sk.onload = ok; sk.onerror = () => weg(new Error("Skript nicht geladen")); document.head.appendChild(sk); });
    } catch (e) { pdfFehler = "Das PDF-Werkzeug konnte nicht geladen werden (keine Verbindung)."; return null; }
    pdfLib = window.pdfjsLib || null;
    if (!pdfLib) { pdfFehler = "Das PDF-Werkzeug steht nicht zur Verfügung."; return null; }
    /* Das Hilfsprogramm läuft direkt in der Seite (ohne eigenen Hintergrundprozess) –
       so funktioniert es auch dort, wo Hintergrundprozesse oder Datenabrufe gesperrt sind. */
    pdfLib.GlobalWorkerOptions.workerSrc = PDF_CDN + "pdf.worker.min.js";
    if (!(window.pdfjsWorker && window.pdfjsWorker.WorkerMessageHandler)) {
      try { await new Promise((ok, weg) => { const sk = document.createElement("script");
        sk.src = PDF_CDN + "pdf.worker.min.js"; sk.onload = ok; sk.onerror = weg; document.head.appendChild(sk); }); }
      catch (x) { pdfFehler = "Das PDF-Werkzeug konnte nicht vollständig geladen werden."; }
    }
    return pdfLib;
  }
  async function pdfText(datei) {
    const lib = await pdfLaden(); if (!lib) return "";
    const daten = new Uint8Array(await datei.arrayBuffer());
    const oeffnen = async (ohneHelfer) => {
      const auftrag = lib.getDocument({ data: daten.slice(), isEvalSupported: false, useWorkerFetch: false, ...(ohneHelfer ? { disableWorker: true } : {}) });
      return await auftrag.promise;
    };
    let doc = null;
    try { doc = await oeffnen(false); }
    catch (e) { try { doc = await oeffnen(true); } catch (e2) { pdfFehler = "Dieses PDF ließ sich nicht lesen."; return ""; } }
    let text = "";
    for (let i = 1; i <= Math.min(doc.numPages, 6); i++) {
      const seite = await doc.getPage(i); const inhalt = await seite.getTextContent();
      text += inhalt.items.map(x => x.str).join(" ") + "\n";
    }
    if (!text.trim()) pdfFehler = "Das PDF enthält keinen lesbaren Text – vermutlich ein Scan. Bitte als Foto hochladen, dann liest die KI mit.";
    return text;
  }
  /* Aus dem Text die Pflichtangaben herausziehen. */
  function ausweisLesen(text) {

    const art = /Bedarfsausweis|Energiebedarfsausweis|Bedarfsorientiert/i.test(t) ? "bedarf" : /Verbrauchsausweis|Verbrauchsorientiert|Energieverbrauchsausweis/i.test(t) ? "verbrauch" : "";

      zahl(/Energieverbrauchskennwert[^0-9]{0,60}([0-9]{1,3}(?:[.,][0-9]+)?)/i);
    const klasse = (/Energieeffizienzklasse[^A-H]{0,20}([A-H]\+?)/i.exec(t) || [])[1] || "";
    const baujahr = (/Baujahr[^0-9]{0,30}((?:1[89]|20)[0-9]{2})/i.exec(t) || [])[1] || "";

    return { ausweisArt: art, energiewert: wert, effizienz: klasse.toUpperCase(), baujahr, energietraeger: traeger };

        "<select aria-label='Art des Kontos' data-kk='" + i + "|art'>" + KONTOARTEN.map(([w, l]) =>
          "<option value='" + w + "'" + (k.art === w ? " selected" : "") + ">" + l + "</option>").join("") + "</select>" +

        (benutzt

            (k.inaktiv ? "Konto wieder verwenden" : "Konto stilllegen – gebuchte Konten dürfen nicht gelöscht werden") + "'>" +

          (istAus

              "<select aria-label='Verteilerschlüssel' data-kk='" + i + "|schluessel'>" +
                SCHLUESSEL.map(([w, l]) => "<option value='" + w + "'" + (k.schluessel === w ? " selected" : "") + ">" + l + "</option>").join("") + "</select></div>" +

              "<select aria-label='§ 35a EStG' data-kk='" + i + "|par35a'>" + PAR35A.map(([w, l]) =>
                "<option value='" + w + "'" + (k.par35a === w ? " selected" : "") + ">" + l + "</option>").join("") + "</select></div></div>" +

              "<button type='button' class='schalter klein' role='switch' aria-checked='" + !!k.umlage + "' aria-label='umlagefähig' data-act='kk-umlage' data-i='" + i + "'></button></div>"
            : "<p class='unter' style='margin:0 0 12px'>" + (verw
                ? "Dieses Konto trägt in der Sollstellung die <strong>" + esc(verw[1]) + "</strong>."
                : "Verteilerschlüssel und § 35a gelten nur für Ausgabekonten. Ob dieses Konto einen Teil der Miete trägt, legen Sie unten in Schritt 3 fest.") + "</p>") +
          (k.inaktiv ? "<p class='unter' style='margin:0 0 12px'><strong>Stillgelegt.</strong> Für neue Buchungen wird dieses Konto nicht mehr angeboten. " +
              "Gebuchte Beträge bleiben erhalten, damit alte Abrechnungen nachvollziehbar bleiben.</p>"
            : benutzt ? "<p class='unter' style='margin:0 0 12px'>Auf dieses Konto wurde bereits gebucht – es lässt sich deshalb nur noch stilllegen, nicht löschen.</p>" : "") +
          "<div class='felder' style='margin-top:12px'><div class='feld'><label>Gehört zur Kontenklasse</label>" +

            klassen.map(x => "<option value='" + esc(x.id) + "'" + (k.klasse === x.id ? " selected" : "") + ">" + esc(klasseTitel(x)) + "</option>").join("") +
          "</select></div></div></div>" : "");
    };

    h += kontenNachKlasse(r).map(g => {
      const auf = !!S.kkAuf[g.id || "ohne"];

      return "<div class='kr-klasse'>" +

        "<span class='fuer'>" + g.posten.length + (g.posten.length === 1 ? " Konto" : " Konten") +
        (nrn.length > 1 ? "<br>Nr. " + esc(nrn[0] + " – " + nrn[nrn.length - 1]) : nrn.length ? "<br>Nr. " + esc(nrn[0]) : "") +
        (um ? "<br>" + um + " umlagefähig" : "") + "</span></button>" +
        (auf ? (g.id ? "<div class='kr-klassefeld'>" +
            "<div class='felder'><div class='feld'><label>Bezeichnung der Klasse</label>" +
            "<input type='text' placeholder='z. B. Umlagefähige Betriebskosten' data-klasse='" + esc(g.id) + "|name' value='" + esc(g.roh) + "'></div>" +
            "<div class='feld'><label>Erläuterung (freiwillig)</label>" +
            "<input type='text' placeholder='kurz, wofür diese Klasse steht' data-klasse='" + esc(g.id) + "|text' value='" + esc(g.text || "") + "'></div></div></div>" : "") +
          (g.posten.length ? spalten + g.posten.map(x => zeile(x.k, x.i)).join("")
            : "<p class='unter' style='padding:14px;margin:0'>Noch kein Konto in dieser Klasse.</p>") +
          "<div class='kr-klasse-fuss'><div class='leiste' style='margin:0;padding:0'>" +
            "<div><button class='btn klein haupt' data-act='kk-neu' data-wert='" + esc(g.id || "") + "'>+ Konto hinzufügen</button>" +
            "<span class='fuer'>Nummer und Bezeichnung vergeben Sie selbst.</span></div>" +
            (g.id ? "<button class='btn gefahr klein' data-act='kr-klasse-weg' data-wert='" + esc(g.id) + "'>" +
              (S.loeschen === "kl" + g.id
                ? (g.posten.length ? "Wirklich löschen? Konten bleiben ohne Klasse" : "Wirklich löschen?")
                : "Klasse löschen") + "</button>" : "") +
          "</div></div>" : "") + "</div>";
    }).join("");
    h += "<div class='leiste'><div><button class='btn klein" + (klassen.length ? "" : " haupt") + "' data-act='kr-klasse-neu'>+ Neue Kontenklasse</button>" +
      (klassen.length ? "" : "<button class='btn klein' data-act='kk-neu'>+ Konto ohne Klasse</button>") + "</div></div>";

    /* ---------- Schritt 3: Welches Konto trägt welchen Teil der Miete ---------- */
    h += "<h3 class='kr-h'>3. Verwendung für die Sollstellung</h3>" +
      "<p class='kr-p'>Weil Sie Nummern und Bezeichnungen frei wählen, muss das Programm wissen, welches Ihrer Konten welchen Teil " +
      (weg ? "des Hausgelds" : "der Miete") + " trägt. Erst damit kann es die monatlichen Sollstellungen selbst anlegen." +
      (weg ? " Die Zuführung zur Erhaltungsrücklage gehört auf ein eigenes Konto – sie ist keine Kosten, sondern Vermögen der Gemeinschaft (§ 19 Abs. 2 Nr. 4 WEG)." : "") + "</p>";
    if (!r.konten.length) h += "<p class='unter'>Sobald Sie Konten angelegt haben, wählen Sie hier aus.</p>";
    else {
      if (fehlt.length) h += "<ul class='meldungen'><li class='m-hinweis'>Noch nicht zugeordnet: " + esc(fehlt.join(", ")) + "</li></ul>";
      h += "<div class='felder'>" + sollPosten(r).map(([feld, name]) => {
        const akt = kontoFuer(r.konten, feld);
        return "<div class='feld'><label for='verw-" + feld + "'>" + esc(name) + "</label>" +
          "<select id='verw-" + feld + "' data-verw='" + feld + "'><option value=''>– noch nicht zugeordnet –</option>" +
          r.konten.filter(k => k.art !== "ausgabe" && !k.inaktiv).map(k => "<option value='" + esc(k.id) + "'" + (akt && akt.id === k.id ? " selected" : "") + ">" +
            esc((String(k.nr).trim() ? String(k.nr).trim() + " · " : "") + (k.name || "ohne Bezeichnung")) + "</option>").join("") +
          "</select></div>";
      }).join("") + "</div>";
      if (!r.konten.some(k => k.art !== "ausgabe"))
        h += "<p class='unter'>Dafür brauchen Sie mindestens ein Konto der Art „Einnahme“.</p>";
    }

    /* ---------- Änderungen am Kontenrahmen ---------- */
    const prot = (r.protokoll || []).slice().reverse();
    h += "<h3 class='kr-h'>Änderungen an dieser Vorlage</h3>" +
      "<p class='kr-p'>Jede Änderung wird mit Datum und Person festgehalten. Das gehört zu Ihrer Verfahrensdokumentation.</p>";
    if (!prot.length) h += "<p class='unter'>Noch keine Änderung aufgezeichnet.</p>";
    else {
      const zeigen = S.krProtAuf ? prot : prot.slice(0, 5);
      h += "<div class='kr-prot'>" + zeigen.map(x =>
        "<div class='kr-prot-zeile'><span class='fuer'>" + esc(Objekte.datum(x.zeit.slice(0, 10))) + " · " + esc(x.person) + "</span>" +
        "<span>" + esc(x.was) + (x.vorher || x.nachher
          ? "<br><span class='fuer'>" + esc(x.vorher || "leer") + " → " + esc(x.nachher || "leer") + "</span>" : "") + "</span></div>").join("") + "</div>";
      if (prot.length > 5) h += "<div class='leiste'><div><button class='btn klein' data-act='kr-prot'>" +
        (S.krProtAuf ? "Weniger anzeigen" : "Alle " + prot.length + " Änderungen anzeigen") + "</button></div></div>";
    }
    h += "<div class='leiste' style='margin-top:22px;border-top:1px solid var(--line);padding-top:14px'>" +
      "<span class='fuer'>" + klassen.length + " Klassen · " + r.konten.length + " Konten in dieser Vorlage</span><div>" +
      (leer ? "" : "<button class='btn gefahr klein' data-act='kr-leeren'>" +
        (S.loeschen === "leer" + r.id ? "Wirklich alles löschen?" : "Vorlage leeren") + "</button>") +
      (liste.length > 1 ? "<button class='btn gefahr klein' data-act='kr-weg' data-id='" + esc(r.id) + "'>" +
        (S.loeschen === "kr" + r.id ? "Wirklich löschen?" : "Vorlage löschen") + "</button>" : "") + "</div></div>";
    return h + "</section>";
  }
  /* ---------- SEPA-Lastschriften ----------
     Aus den offenen Sollstellungen eines Monats wird eine Einreichungsdatei im Format
     pain.008 erzeugt. Sie laden sie in Ihrem Online-Banking hoch; der direkte Weg über
     EBICS kommt später auf dem Server. Eine Basislastschrift muss mindestens einen
     Geschäftstag vor Fälligkeit bei der Bank sein. */
  const xmlText = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  /* SEPA lässt nur einen eingeschränkten Zeichenvorrat zu. */
  const sepaText = (t, max) => String(t || "")
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/Ä/g, "Ae").replace(/Ö/g, "Oe").replace(/Ü/g, "Ue").replace(/ß/g, "ss")
    .replace(/[^A-Za-z0-9/?:().,'+\- ]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || 70);
  const mandatRefVon = (o, e, pn) => sepaText(String(pn.mandatRef || "").trim() ||
    [(o.nummer || "OBJ"), (e && (e.nr || e.art)) || "", (pn.nachname || pn.firma || "").slice(0, 10)].filter(Boolean).join("-"), 35)
    .replace(/\s/g, "-");
  const naechsterGeschaeftstag = d => { const x = new Date(d); const fest = feiertageBund(x.getFullYear());
    for (let i = 0; i < 20; i++) { const t = x.getDay(); if (t !== 0 && t !== 6 && !fest.has(isoTag(x))) return isoTag(x); x.setDate(x.getDate() + 1); } return isoTag(x); };
  function geschaeftstagePlus(iso, n) { const x = new Date(iso); const fest = feiertageBund(x.getFullYear());
    let offen = n; while (offen > 0) { x.setDate(x.getDate() + 1); const t = x.getDay(); if (t !== 0 && t !== 6 && !fest.has(isoTag(x))) offen--; }
    return isoTag(x); }
  /* Alle einziehbaren Posten eines Monats mit Prüfung, was noch fehlt. */
  function lastschriftPosten(o, monat) {
    const aus = [];
    sollListe(o).filter(s => s.monat === monat && !s.storniert).forEach(s => {
      const e = (o.einheitenListe || []).find(x => x.id === s.einheitId);
      const pn = personVon(s.mieterId) || (e ? zahlerVon(o, e) : null);
      const offen = Math.round((s.summe - gezahltAuf(o, s.id)) * 100) / 100;
      const maengel = [];
      if (!pn) maengel.push("kein Zahler hinterlegt");
      else {
        if (!pn.mandat) maengel.push("kein Lastschriftmandat");
        if (!pn.mandatDatum) maengel.push("Unterschriftsdatum des Mandats fehlt");
        if (!Objekte.ibanGueltig(pn.iban)) maengel.push("IBAN fehlt oder ist ungültig");
      }
      if (offen <= 0) maengel.push("nichts mehr offen");
      aus.push({ s, e, pn, offen, maengel, einziehbar: !maengel.length });
    });
    return aus.sort((a, b) => String((a.e && a.e.nr) || "").localeCompare(String((b.e && b.e.nr) || ""), "de", { numeric: true }));
  }
  function lastschriftXml(o, monat, posten, faellig) {
    const b = objektBank(o);
    const acht = b.painVersion !== "02";
    const ns = acht ? "pain.008.001.08" : "pain.008.001.02";
    const bicTag = acht ? "BICFI" : "BIC";
    const jetzt = new Date().toISOString().slice(0, 19);
    const msgId = sepaText("LS-" + (o.nummer || "OBJ") + "-" + monat + "-" + Date.now().toString(36), 35).replace(/\s/g, "-");
    const summe = posten.reduce((a, x) => a + x.offen, 0);
    const z = n => n.toFixed(2);
    const kopf = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" +
      "<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:" + ns + "\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n" +
      "<CstmrDrctDbtInitn>\n<GrpHdr><MsgId>" + msgId + "</MsgId><CreDtTm>" + jetzt + "</CreDtTm>" +
      "<NbOfTxs>" + posten.length + "</NbOfTxs><CtrlSum>" + z(summe) + "</CtrlSum>" +
      "<InitgPty><Nm>" + xmlText(sepaText(b.inhaber, 70)) + "</Nm></InitgPty></GrpHdr>\n" +
      "<PmtInf><PmtInfId>" + msgId + "-1</PmtInfId><PmtMtd>DD</PmtMtd><BtchBookg>true</BtchBookg>" +
      "<NbOfTxs>" + posten.length + "</NbOfTxs><CtrlSum>" + z(summe) + "</CtrlSum>" +
      "<PmtTpInf><SvcLvl><Cd>SEPA</Cd></SvcLvl><LclInstrm><Cd>CORE</Cd></LclInstrm><SeqTp>RCUR</SeqTp></PmtTpInf>" +
      "<ReqdColltnDt>" + faellig + "</ReqdColltnDt>" +
      "<Cdtr><Nm>" + xmlText(sepaText(b.inhaber, 70)) + "</Nm></Cdtr>" +
      "<CdtrAcct><Id><IBAN>" + Objekte.ibanRoh(b.iban) + "</IBAN></Id></CdtrAcct>" +
      (b.bic ? "<CdtrAgt><FinInstnId><" + bicTag + ">" + xmlText(String(b.bic).trim()) + "</" + bicTag + "></FinInstnId></CdtrAgt>" : "") +
      "<ChrgBr>SLEV</ChrgBr>" +
      "<CdtrSchmeId><Id><PrvtId><Othr><Id>" + xmlText(String(b.glaeubigerId).replace(/\s+/g, "")) + "</Id>" +
      "<SchmeNm><Prtry>SEPA</Prtry></SchmeNm></Othr></PrvtId></Id></CdtrSchmeId>\n";
    const zeilen = posten.map((x, i) => {
      const zweck = sepaText((istWeg(o) ? "Hausgeld " : "Miete ") + monatText(x.s.monat) + " " +
        ((x.e && (x.e.nr || x.e.art)) || "") + " " + (objName(o) || ""), 140);
      return "<DrctDbtTxInf><PmtId><EndToEndId>" + sepaText(msgId + "-" + (i + 1), 35).replace(/\s/g, "-") + "</EndToEndId></PmtId>" +
        "<InstdAmt Ccy=\"EUR\">" + z(x.offen) + "</InstdAmt>" +
        "<DrctDbtTx><MndtRltdInf><MndtId>" + xmlText(mandatRefVon(o, x.e, x.pn)) + "</MndtId>" +
        "<DtOfSgntr>" + xmlText(String(x.pn.mandatDatum).slice(0, 10)) + "</DtOfSgntr></MndtRltdInf></DrctDbtTx>" +
        (x.pn.bic ? "<DbtrAgt><FinInstnId><" + bicTag + ">" + xmlText(String(x.pn.bic).trim()) + "</" + bicTag + "></FinInstnId></DbtrAgt>" : "") +
        "<Dbtr><Nm>" + xmlText(sepaText(x.pn.kontoinhaber || Objekte.personName(x.pn), 70)) + "</Nm></Dbtr>" +
        "<DbtrAcct><Id><IBAN>" + Objekte.ibanRoh(x.pn.iban) + "</IBAN></Id></DbtrAcct>" +
        "<RmtInf><Ustrd>" + xmlText(zweck) + "</Ustrd></RmtInf></DrctDbtTxInf>\n";
    }).join("");
    return kopf + zeilen + "</PmtInf>\n</CstmrDrctDbtInitn>\n</Document>\n";
  }
  function lastschriftHtml(o) {
    if (!["miet", "garantie", "weg"].includes(o.art)) return "";
    const monat = S.lsMonat || heuteMonat();
    const posten = lastschriftPosten(o, monat);
    const gut = posten.filter(x => x.einziehbar);
    const summe = gut.reduce((a, x) => a + x.offen, 0);
    const konto = objektBank(o);
    const frueh = geschaeftstagePlus(naechsterGeschaeftstag(new Date()), Number(konto.vorlauf || 2));
    const faellig = S.lsDatum && S.lsDatum >= frueh ? S.lsDatum : frueh;
    let h = "<section class='gruppe voll'><h2>Lastschriften einziehen</h2>" +
      "<p class='unter'>Das Programm sammelt die offenen " + (istWeg(o) ? "Hausgelder" : "Mieten") + " eines Monats und erzeugt daraus die SEPA-Datei, " +
      "die Sie in Ihrem Online-Banking hochladen. Der direkte Weg über EBICS kommt mit dem Server.</p>";
    if (!kontoVollstaendig(konto)) return h + "<ul class='meldungen'><li class='m-hinweis'>Für dieses Objekt ist noch kein vollständiges Bankkonto hinterlegt. " +
      "Tragen Sie es oben unter „Bankkonto dieses Objekts“ ein – oder, wenn alles über ein Konto läuft, in den Einstellungen unter „Bankzugang der Verwaltung“.</li></ul></section>";
    h += "<p class='unter'>Eingezogen wird auf: <strong>" + esc(konto.inhaber) + "</strong>, " + esc(Objekte.ibanFormat(konto.iban)) +
      " · Gläubiger-ID " + esc(konto.glaeubigerId) +
      " <span class='fuer'>(" + (konto.eigen ? "Konto dieses Objekts" : "Konto der Verwaltung") + ")</span></p>";
    h += "<div class='felder'>" +
      "<div class='feld'><label for='ls-monat'>Monat</label><input type='month' id='ls-monat' data-ls='monat' value='" + esc(monat) + "'></div>" +
      "<div class='feld'><label for='ls-faellig'>Einzug am</label><input type='date' id='ls-faellig' data-ls='datum' value='" + esc(faellig) + "' min='" + esc(frueh) + "'>" +
      "<small>Frühestens " + esc(Objekte.datum(frueh)) + " – vorher ist die Datei nicht rechtzeitig bei der Bank.</small></div></div>";
    if (!posten.length) return h + "<p class='unter'>Für " + esc(monatText(monat)) + " gibt es keine Sollstellungen.</p></section>";
    h += "<div class='op-kopf' style='grid-template-columns:110px 1fr 130px 1fr'><span>Einheit</span><span>Zahler</span><span>Offen</span><span>Hinweis</span></div>" +
      posten.map(x => "<div class='op-zeile' style='grid-template-columns:110px 1fr 130px 1fr'>" +
        "<span><strong>" + esc((x.e && (x.e.nr || x.e.art)) || "–") + "</strong></span>" +
        "<span>" + esc(x.pn ? Objekte.personName(x.pn) : "–") + "</span>" +
        "<span class='so-betrag'>" + eur(x.offen) + "</span>" +
        "<span>" + (x.einziehbar ? "<span class='marke s-erledigt'>wird eingezogen</span>"
          : "<span class='fuer'>" + esc(x.maengel.join(" · ")) + "</span>") + "</span></div>").join("") +
      "<div class='op-zeile op-summe' style='grid-template-columns:110px 1fr 130px 1fr'><span><strong>Summe</strong></span>" +
      "<span class='fuer'>" + gut.length + " von " + posten.length + " Posten</span>" +
      "<span class='so-betrag'><strong>" + eur(summe) + "</strong></span><span></span></div>";
    h += "<div class='leiste'><div><button class='btn haupt' data-act='ls-datei'" + (gut.length ? "" : " disabled") + ">SEPA-Datei erzeugen</button>" +
      "<span class='fuer'>" + (gut.length ? "Lädt die Datei herunter; einreichen müssen Sie sie selbst." : "Nichts einziehbar – bitte die Hinweise oben beheben.") + "</span></div></div>" +
      "<ul class='meldungen' style='margin-top:12px'><li class='m-hinweis'>Das Erzeugen der Datei ist noch keine Zahlung. " +
      "Erst wenn das Geld eingeht, erfassen Sie es als Zahlung – oder künftig automatisch über den Kontoauszug.</li></ul>";
    return h + "</section>";
  }
  /* ---------- Bankzugang der Verwaltung ----------
     Eigenes Konto und Gläubiger-Identifikationsnummer für SEPA-Lastschriften.
     Die EBICS-Angaben stehen hier nur als Notiz für den Serverbetrieb – Schlüssel und
     Kennwörter gehören niemals in den Browser. */
  const BANK_LEER = { inhaber: "", iban: "", bic: "", bank: "", glaeubigerId: "",
    ebicsBank: "", ebicsUrl: "", hostId: "", partnerId: "", userId: "", ebicsVersion: "H005",
    painVersion: "08", vorlauf: "2" };
  function bankzugang() {
    if (!S.bank) { try { S.bank = { ...BANK_LEER, ...JSON.parse(localStorage.getItem("ov_bankzugang") || "{}") }; }
      catch (e) { S.bank = { ...BANK_LEER }; } }

 {id:"m-aufgaben",fuer:"miet",pflicht:true,titel:"Aufgaben des Verwalters",grundlage:"§§ 551, 556 BGB, BetrKV",
  text:"(1) Der Verwalter übernimmt insbesondere folgende Aufgaben:\n– Einzug der Mieten und Nebenkostenvorauszahlungen sowie das kaufmännische Mahnwesen,\n– Erstellung der Betriebskostenabrechnungen nach § 556 BGB und der Betriebskostenverordnung innerhalb von zwölf Monaten nach Ende des Abrechnungszeitraums,\n– Verwaltung der Mietsicherheiten getrennt vom übrigen Vermögen (§ 551 Abs. 3 BGB),\n– Beauftragung und Überwachung von Handwerkern und Dienstleistern,\n– Schriftverkehr mit Mietern, Behörden und Versorgern,\n– jährliche Abrechnung gegenüber dem Auftraggeber.\n\n(2) Aufträge für Instandhaltungsmaßnahmen darf der Verwalter bis zu einem Betrag von [Freigabegrenze] € je Einzelfall ohne vorherige Zustimmung erteilen. Bei Gefahr im Verzug veranlasst er darüber hinaus die notwendigen Sofortmaßnahmen und unterrichtet den Auftraggeber unverzüglich."},
 {id:"w-aufgaben",fuer:"weg",pflicht:true,titel:"Aufgaben und Befugnisse",grundlage:"§§ 9b, 24, 27, 28 WEG",

 {id:"m-vollmacht",fuer:"miet",pflicht:true,titel:"Vollmacht",grundlage:"§§ 164, 175 BGB",

 {id:"b-verguetung",fuer:"beide",pflicht:true,titel:"Vergütung",grundlage:"§ 612 BGB, PAngV",

<!-- ================= Verträge – Modul: VSpeicher (Daten sichern und laden) ================= -->
<script>
const VSpeicher = (() => {
  let db = null; const warte = {};
  const lokal = (k, fb) => { try { const v = localStorage.getItem("vv_" + k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
  const lokalSetzen = (k, v) => { try { localStorage.setItem("vv_" + k, JSON.stringify(v)); } catch (e) {} };
  async function verbinden() {
    try { if (!window.claude || typeof window.claude.use !== "function") return false; db = await window.claude.use("db"); return !!db; }
    catch (e) { db = null; return false; }
  }
  async function laden(k) {
    if (!db) return null;
    try { const s = await db.doc("einstellungen/" + k).get(); return s.exists ? JSON.parse(JSON.stringify(s.data().wert)) : null; }
    catch (e) { return null; }
  }
  function speichern(k, v) {
    lokalSetzen(k, v);
    if (!db) return;
    clearTimeout(warte[k]);
    warte[k] = setTimeout(async () => {
      try { await db.doc("einstellungen/" + k).set({ wert: v, geaendert: new Date().toISOString() }); }
      catch (e) { window.dispatchEvent(new CustomEvent("speicherfehler", { detail: e && e.code })); }
    }, 400);
  }
  return { lokal, lokalSetzen, verbinden, laden, speichern, online: () => !!db };
})();
</script>

<!-- ================= Verträge – Modul: Vertragslogik (baut den Vertrag, ohne Oberfläche) ================= -->
<script>
const Vertrag = (() => {
  const PLATZHALTER = [["Verwalter","verwalter"],["Auftraggeber","auftraggeber"],["Objekt","objekt"],["Einheiten","einheiten"],["Einheitenaufstellung","einheitenaufstellung"],
    ["Vergütungsaufstellung","aufstellung"],["Vergütung gesamt","gesamt"],["Vergütung gesamt brutto","gesamtBrutto"],
    ["Vergütung","verguetung"],["Vergütung brutto","brutto"],["Freigabegrenze","freigrenze"],["Vertragsbeginn","beginn"],
    ["Laufzeit","laufzeit"],["Vertragsende","ende"],["Beschlussdatum","beschluss"]];
  const datum = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return d + "." + m + "." + y; };
  const euro = v => (v === "" || v == null || isNaN(Number(v))) ? "" : Number(v).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function ende(beginn, jahre) {
    if (!beginn || !jahre) return "";
    const d = new Date(beginn + "T12:00:00"); d.setFullYear(d.getFullYear() + Number(jahre)); d.setDate(d.getDate() - 1);
    return d.toISOString().slice(0, 10);
  }
  function werte(a, v) {
    const posten = (a.posten || []).filter(p => Number(p.anzahl) > 0);
    const preiseOk = posten.length > 0 && posten.every(p => p.preis !== "" && p.preis != null && !isNaN(Number(p.preis)));
    const summe = posten.reduce((n, p) => n + Number(p.anzahl) * (Number(p.preis) || 0), 0);
    const netto = posten.length ? (preiseOk ? Number(posten[0].preis) : "") : (a.verguetung === "" || a.verguetung == null ? "" : Number(a.verguetung));
    return { verwalter: v.name, auftraggeber: a.auftraggeber, objekt: a.objekt,
      einheiten: posten.length ? String(posten.reduce((n, p) => n + Number(p.anzahl), 0)) : a.einheiten,
      einheitenaufstellung: posten.map(p => p.anzahl + " × " + p.name).join(", "),
      aufstellung: preiseOk ? posten.map(p => "– " + p.name + ": " + p.anzahl + " × " + euro(p.preis) + " € = " + euro(Number(p.anzahl) * Number(p.preis)) + " €").join("\n") : "",
      gesamt: preiseOk ? euro(summe) : "", gesamtBrutto: preiseOk ? euro(Math.round(summe * 119) / 100) : "",
      verguetung: euro(netto), brutto: netto === "" ? "" : euro(Math.round(netto * 119) / 100), freigrenze: euro(a.freigrenze),
      beginn: datum(a.beginn), laufzeit: a.laufzeit, ende: datum(ende(a.beginn, a.laufzeit)), beschluss: datum(a.beschluss) };
  }
  const passt = (k, art) => k.fuer === "beide" || k.fuer === art;
  const fragen = (alle, art) => alle.filter(k => passt(k, art) && !k.pflicht);
  const gewaehlt = (k, antworten) => k.pflicht || (k.id in antworten ? antworten[k.id] : !!k.standard);
  const auswahl = (alle, art, antworten) => alle.filter(k => passt(k, art) && gewaehlt(k, antworten));
  function fuellen(text, w) {
    const teile = []; const re = /\[([^\]]+)\]/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) teile.push({ t: "text", v: text.slice(last, m.index) });
      const p = PLATZHALTER.find(x => x[0] === m[1]);
      if (!p) teile.push({ t: "text", v: m[0] });
      else if (w[p[1]] !== "" && w[p[1]] != null) teile.push({ t: "wert", v: String(w[p[1]]) });
      else teile.push({ t: "luecke", v: m[1] });
      last = re.lastIndex;
    }
    if (last < text.length) teile.push({ t: "text", v: text.slice(last) });
    return teile;
  }
  function bauen(art, a, verwalter, alle, antworten) {
    const w = werte(a, verwalter); const liste = auswahl(alle, art, antworten);
    const titel = art === "weg" ? "Verwaltervertrag für die Verwaltung des gemeinschaftlichen Eigentums (WEG-Verwaltung)"
                                : "Verwaltervertrag über die Mietverwaltung";
    const auftraggeber = [fuellen("[Auftraggeber]", w), fuellen(a.anschrift || "", w)];
    const agVertreter = art === "weg" && a.vertreter ? "vertreten durch " + a.vertreter : "";
    const anlagen = [];
    if (liste.some(k => k.id === "m-vollmacht")) anlagen.push("Vollmacht");
    if (liste.some(k => k.id === "o-sonder")) anlagen.push("Sondervergütungen");
    if (liste.some(k => k.id === "o-widerruf")) anlagen.push("Widerrufsbelehrung und Muster-Widerrufsformular");
    return { titel, auftraggeber, agVertreter, rolle: art === "weg" ? "Gemeinschaft" : "Auftraggeber", verwalter, anlagen,
      paragraphen: liste.map((k, i) => ({ nr: i + 1, id: k.id, optional: !k.pflicht, titel: k.titel,
        absaetze: String(k.text || "").split(/\n\s*\n/).map(t => fuellen(t.trim(), w)) })) };
  }
  const neueId = () => (crypto.randomUUID ? crypto.randomUUID() : "k" + Date.now() + Math.random().toString(16).slice(2));
  return { PLATZHALTER, bauen, fragen, auswahl, gewaehlt, ende, neueId };
})();
</script>

<!-- ================= Verträge – Modul: Rechtsprüfung (Warnungen vor der Ausgabe) ================= -->
<script>
const Pruefung = (() => {
  function pruefen(art, a, verwalter, vertrag) {
    const m = []; const f = t => m.push({ stufe: "fehler", text: t }); const h = t => m.push({ stufe: "hinweis", text: t });
    if (!verwalter.name) h("Ihre Firmendaten fehlen noch. Tragen Sie sie unter „Meine Firmendaten“ ein.");
    if (!a.auftraggeber) f(art === "weg" ? "Der Name der Gemeinschaft fehlt." : "Der Name des Auftraggebers fehlt.");
    if (!a.objekt) f("Die Anschrift des Objekts fehlt.");
    if (a.posten) {
      const aktiv = a.posten.filter(p => Number(p.anzahl) > 0);
      if (!aktiv.length) f("Tragen Sie bei „Einheiten und Vergütung“ mindestens eine Einheit ein.");
      aktiv.filter(p => p.preis === "" || p.preis == null).forEach(p => f("Für „" + p.name + "“ fehlt die monatliche Vergütung."));
    }
    if (!a.beginn) f("Der Vertragsbeginn fehlt.");
    const jahre = Number(a.laufzeit);
    if (!jahre) f("Die Laufzeit fehlt.");
    if (art === "weg") {
      if (jahre > 5) f("Die Bestellung darf höchstens fünf Jahre dauern (§ 26 Abs. 2 WEG).");
      if (a.erstbestellung && jahre > 3) f("Bei der ersten Bestellung nach Begründung von Wohnungseigentum sind höchstens drei Jahre zulässig (§ 26 Abs. 2 WEG).");
      if (!a.beschluss) h("Das Datum des Bestellungsbeschlusses fehlt. Ohne Beschluss ist die Bestellung nicht wirksam (§ 26 Abs. 1 WEG).");
      if (a.auftraggeber && !/Gemeinschaft der Wohnungseigentümer|^\s*WEG\b/i.test(a.auftraggeber))
        h("Die Gemeinschaft sollte erkennbar benannt sein, z. B. „WEG Lindenstraße 4, 40210 Düsseldorf“ oder „Gemeinschaft der Wohnungseigentümer Lindenstraße 4“ (§ 9a Abs. 1 WEG).");
    }
    if (art === "miet" && a.verbraucher && jahre > 2)
      h("Bei Verbrauchern darf die Erstlaufzeit in vorformulierten Verträgen höchstens zwei Jahre betragen (§ 309 Nr. 9 BGB).");
    if (a.verbraucher && !vertrag.paragraphen.some(p => p.id === "o-widerruf" || /widerruf/i.test(p.titel)))
      h("Der Auftraggeber ist Verbraucher. Prüfen Sie, ob ein Widerrufsrecht besteht (Vertragsschluss außerhalb Ihres Büros oder per E-Mail/Telefon, §§ 312b, 312c BGB).");
    const luecken = vertrag.paragraphen.reduce((n, p) => n + p.absaetze.flat().filter(s => s.t === "luecke").length, 0);
    if (luecken) h(luecken + " Platzhalter im Vertrag sind noch nicht ausgefüllt (gelb markiert).");
    if (!vertrag.paragraphen.length) f("Der Vertrag enthält noch keine Klauseln.");
    return m;
  }
  return { pruefen };
})();
</script>

      preis: b[t.id] && b[t.id].preis !== undefined ? b[t.id].preis : t.preis })) };
  }
  const vertrag = () => Vertrag.bauen(S.art, vertragsAngaben(), S.verwalter, S.klauseln, S.antworten);

      S.angaben.laufzeit = String(neu); const el = $("#f-laufzeit"); if (el) el.value = neu;
      if (zeigen && n > max) toast("Höchstens " + max + " Jahre möglich – Laufzeit auf " + max + " Jahre gesetzt.");
    }
  }
  const schalter = (key, an, text, hilfe) => "<div class='schalter-zeile'><div class='text'>" + esc(text) + (hilfe ? "<small>" + esc(hilfe) + "</small>" : "") + "</div>" +
    "<button type='button' class='schalter' role='switch' aria-checked='" + !!an + "' aria-label='" + esc(text) + "' data-act='schalter' data-key='" + esc(key) + "'></button></div>";

  /* Name und Zustellanschrift ergeben sich aus der Objektanschrift. */
  const vertragKuerzel = () => S.art === "weg" ? "WEG" : "MV";
  function anschriftenSetzen() {
    const a = S.angaben;
    if (!a.objStrasse && !a.objPlzOrt && a.objekt) { const t = String(a.objekt).split(","); a.objStrasse = (t[0] || "").trim(); a.objPlzOrt = t.slice(1).join(",").trim(); }
    const adr = [a.objStrasse, a.objPlzOrt].map(x => String(x || "").trim()).filter(Boolean).join(", ");

    if (!a.abwAnschrift) { a.empfStrasse = a.objStrasse || ""; a.empfPlzOrt = a.objPlzOrt || ""; }

  }
  function maskeHtml() {
    anschriftenSetzen();
    const weg = S.art === "weg";
    let h = "<div class='seite'><div class='hero'><h1>Neuer Verwaltervertrag</h1><p>Füllen Sie einfach aus, was Sie wissen. Den fertigen Vertrag sehen Sie ganz am Ende.</p></div>";

      "<button data-act='art' data-art='miet' aria-pressed='" + (S.art === "miet") + "'><strong>Mietverwaltung</strong><span>Für Eigentümer vermieteter Wohnungen oder Häuser</span></button>" +
      "<button data-act='art' data-art='weg' aria-pressed='" + weg + "'><strong>WEG-Verwaltung</strong><span>Für eine Gemeinschaft der Wohnungseigentümer</span></button></div></section>";

      "<button type='button' class='schalter' role='switch' aria-checked='" + !!S.angaben.abwAnschrift + "' aria-label='abweichende Zustellanschrift' data-act='abw-anschrift'></button></div>" +

  }

  /* ---------- Einheiten in der Maske ---------- */
  const zahl = v => (v === "" || v == null || isNaN(Number(v))) ? null : Number(v);

        "<label class='p-feld'>Anzahl<input type='number' min='0' step='1' inputmode='numeric' placeholder='0' data-posten='" + esc(t.id) + "' data-teil='anzahl' value='" + esc(e.anzahl) + "'></label>" +

    }).join("") + "</div>" + (weitere.length ? "<div class='chips p-mehr'><span class='leise'>Weitere Einheit hinzufügen:</span>" +
      weitere.map(t => "<button type='button' data-act='p-hinzu' data-id='" + esc(t.id) + "'>+ " + esc(t.name || "Einheit") + "</button>").join("") + "</div>" : "") + "<div class='p-gesamt'><div>Monatlich gesamt<small id='p-anzahl'></small></div><div style='text-align:right'><strong id='p-netto'></strong><small id='p-brutto'></small></div></div>" +
      "<p class='leise' style='text-align:left;margin-top:10px'>Arten und Standardpreise legen Sie unter „Einheiten“ fest. Hier angepasste Preise gelten nur für diesen Vertrag.</p>";
  }
  function summenAktualisieren() {
    let n = 0, stueck = 0;

      const t = passendeArten()[i]; if (!t.standard && !S.angaben.bestand[t.id]) return; const a = zahl(p.anzahl) || 0, pr = zahl(p.preis); const el = document.getElementById("ps-" + t.id);
